<style>
/* Layout: a clean match report. Single column, hairline rules, generous white space; the d20 is the one solid accent, everything else is ink on paper. */
:root{
  --bg:#f7f7f5; --card:#ffffff; --sunk:#f2f3f1; --ink:#15171c; --ink-2:#4a4f5c; --ink-3:#8a8f9b; --rule:#e2e3e0; --rule-2:#cfd1cc;
  --accent:#3346d3; --accent-soft:#eceefc; --on-accent:#ffffff;
  --good:#1f63d6; --good-soft:#e8f0fd; --bad:#c23a2e; --bad-soft:#fbeceb; --warn:#a86512; --warn-soft:#fbf1e3; --draw:#a08a5c;
  --d20:#2b2e35; --dshade:.3; --dshade2:.11; --dlite:.08; --dnum:#ffffff; --d10:#ffffff; --d10num:#15171c; --dedge:rgba(21,23,28,.35);
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416; --draw:#b8a27a;
  --d20:#d5d8de; --dshade:.1; --dshade2:.28; --dlite:.22; --dnum:#15171c; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416; --draw:#b8a27a;
  --d20:#d5d8de; --dshade:.1; --dshade2:.28; --dlite:.22; --dnum:#15171c; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-ui);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600;line-height:1.15}
.lbl{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--ink-3);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.mark{font-weight:600;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark b{color:var(--accent);font-weight:600}
.mark svg{width:22px;height:22px;flex:none}
.mark svg{width:24px;height:24px}
.top .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langs{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.langs button{background:transparent;border:0;color:var(--ink-3);font-size:12px;font-weight:600;padding:5px 9px;letter-spacing:.03em}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule-2);border-radius:7px;color:var(--ink-2);font-size:12px;font-weight:600;padding:5px 9px}
.theme-btn svg{width:14px;height:14px}
.theme-btn.icon{padding:5px 7px}
.setw{position:relative}
.setmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px;font-size:14px;color:var(--ink)}
.setrow+.setrow{border-top:1px solid var(--rule)}
.setrow .theme-btn .tl{display:inline!important}
.setrow .langs button{padding:4px 9px;font-size:12px}
.theme-btn.icon svg path:first-child{fill:currentColor;fill-opacity:.15}
.theme-btn svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;border-bottom:1.5px solid transparent;color:var(--ink-3);font-weight:500;font-size:14.5px;padding:8px 12px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* panels */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}
.panel.hero{border-color:var(--rule-2)}
/* player sheet */
.who{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.who h2{font-size:26px}
.rating{text-align:right}
@media (max-width:520px){.rating{text-align:left}}
.rating .big{font-family:var(--f-num);font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em}
.pos{display:inline-flex;align-items:center;gap:8px}
.pos .ab{font-family:var(--f-num);font-weight:500;font-size:11px;border:1px solid var(--ink);padding:1px 6px;border-radius:4px;line-height:1.5}
.abil{display:grid;grid-template-columns:repeat(8,1fr);margin-top:18px;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
@media (max-width:620px){.abil{grid-template-columns:repeat(4,1fr)}}
.ab-cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.ab-cell .lbl{font-size:9.5px;letter-spacing:.01em;max-width:100%;line-height:1.25;white-space:nowrap}
@media (max-width:420px){.ab-cell .lbl,.pickbtn .lbl{font-size:8.5px;letter-spacing:0}}
.lshort{display:none} .l3{display:none}
@media (max-width:360px){.lfull{display:none}.lshort{display:inline}}
.ab-v{font-family:var(--f-num);font-weight:500;font-size:24px;line-height:1.1}
.ab-m{font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.gain,.loss{font-family:var(--f-num);font-size:11px;font-weight:600;vertical-align:super;margin-left:2px;line-height:0}
.gain{color:var(--good)} .loss{color:var(--bad)}
/* fan support */
.fanbar{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap;flex-wrap:nowrap;min-width:0}.fb-head>*{white-space:nowrap}
.fb-state{font-size:13px;font-weight:600}
.fb-track{position:relative;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden}
.fb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .6s ease,background .3s}
.fb-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.9}
.fb-scale{position:relative;height:28px;font-size:10.5px;color:var(--ink-3)}.fb-scale span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}.fb-scale span.r2{top:13px}.fb-scale span.first,.fb-scale span.last{transform:none}.fb-scale span.cur{color:var(--ink);font-weight:600}
.fb-seg{position:absolute;top:-6px;bottom:-6px;cursor:help}
.fanbar.full{margin-top:2px}.onepage .fanbar.full .fb-scale{display:block}
.teambar{margin-top:10px}
.bars .teambar{margin-top:10px}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.numgrid>div{background:var(--card);padding:7px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.numgrid .lbl{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numgrid b{font-family:var(--f-num);font-weight:500;font-size:17px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:13.5px}
.crow:first-child{border-top:0}
.crow .yr{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3)}
.crow .cl{display:flex;align-items:center;gap:6px;min-width:0}
.crow .cl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cl .muted{font-size:12px;white-space:nowrap}
.crow .nm{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.crow .cups{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.crow .cups .cup,.crow .cups .chip{font-size:11px;padding:1px 6px}
.sv-card{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sv-big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sv-chips{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:12.5px;margin-top:6px}
.sv-list{display:flex;flex-direction:column}
.sv-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.sv-row:first-child{border-top:0}
@media (hover:hover){.track,.scrollbox,.ms-scroll,.pscroll,.ovcard,.slotin{scrollbar-color:transparent transparent;scrollbar-width:thin}
 .track:hover,.scrollbox:hover,.ms-scroll:hover,.pscroll:hover,.ovcard:hover,.slotin:hover{scrollbar-color:rgba(140,145,155,.45) transparent}}
.tabs{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.onepage{height:100vh;height:100dvh;overflow:hidden}
.onepage .wrap{height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:12px}
.onepage .wrap>*{flex:none}
.onepage .wrap>.panel.hero{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.onepage .wrap>.panel.hero>.stage{margin:auto 0}
.onepage .panel{padding:14px 16px}
.onepage .who h2{font-size:22px}
.onepage .rating .big{font-size:30px}
.onepage .fanbar{margin-top:10px;gap:4px}
.onepage .fb-scale{display:none}
.onepage .bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.onepage .bars .fanbar{margin-top:10px}
.onepage .abil{margin-top:12px}
.onepage .ab-cell{padding:6px 2px}
.onepage .ab-v{font-size:20px}
.onepage .dicecol .d20{max-width:104px}
.onepage .dicecol .die{max-width:96px}
.onepage .verdict{font-size:20px}
.onepage .install{display:none}
html.onepage,body.onepage{margin:0;height:100%;overflow:hidden;box-sizing:border-box}
.onepage .rating>.lbl:last-child{display:none}
.onepage .who .pos .lbl{font-size:10.5px}
.onepage .stage .lbl{font-size:10px}
.onepage .stage .evbox{padding:7px 10px;gap:3px}
.onepage .stage .evbox,.onepage .stage .evdesc{font-size:12.5px;line-height:1.4}
.onepage .stage .sum{font-size:13px}
.onepage .stage .verdict{font-size:18px}
.onepage .stage .muted.small,.onepage .stage .small{font-size:12px}
.onepage .stage .banner{font-size:13px;padding:6px 10px}
.top{flex-wrap:nowrap;padding-bottom:0}
.top .meta{flex-wrap:nowrap;gap:6px}
.top .meta>.lbl,.top [data-act="reset"],.theme-btn .tl{display:none}
.mark{font-size:20px}
.tabs button{padding-block:6px}
@media (max-width:440px){.tabs{gap:0}.tabs button{padding-inline:6px;font-size:13px}.tabs .tab-home{padding-inline:4px 8px}.tablogo{width:24px;height:24px}}
.onepage .who{flex-wrap:nowrap;gap:10px}
.onepage .who>.stack{gap:3px!important;min-width:0}
.onepage .who .muted{font-size:14px}
.onepage .rating .big{font-size:26px}
.onepage .bars .fanbar{margin-top:8px}
.onepage .abil{grid-template-columns:repeat(8,1fr)!important;margin-top:10px}
.onepage .lfull,.onepage .lshort{display:none!important} .onepage .l3{display:inline}
.onepage .ab-cell{padding:5px 1px}
.onepage .ab-v{font-size:18px}
.onepage .ab-m{font-size:10px}
.onepage .wrap>.panel.hero{padding:12px 14px}
.onepage .stage:not(.v){grid-template-columns:96px minmax(0,1fr)!important;gap:14px}

.onepage .stage h3{font-size:19px}
.onepage .stage .dicecol{gap:6px}
.onepage .stage .dicecol .small{max-width:34px}
.onepage .stage .dcell .lbl{font-size:9px}
.onepage .stage .stack{gap:7px!important}
.onepage .stage .evdesc,.onepage .stage .evbox{font-size:13.5px}
.onepage .stage .chip{font-size:11.5px;padding:2px 7px}
.onepage .stage .btn{padding:9px 14px;font-size:14px}
.onepage .stage .row{flex-wrap:nowrap;align-items:center}
.tl-s{display:none} .onepage .tl-l{display:none} .onepage .tl-s{display:inline}
.onepage .stage [data-act="simrest"]{display:none}
.onepage .stage .row .btn:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onepage .stage .btn.ghost.sm{flex:none;padding:8px 10px;font-size:12.5px}
.tabs .tab-home{display:inline-flex;align-items:center;justify-content:center;padding-inline:10px}
.tablogo{width:26px;height:26px;display:block}
.tab-home[aria-selected="true"] .tablogo{color:var(--accent)}
.teambar .fb-fill{background:var(--ink-3)} .teambar .fb-state{color:var(--ink-2)}
.teambar.tl0 .fb-fill,.teambar.tl1 .fb-fill{background:var(--accent)} .teambar.tl0 .fb-state,.teambar.tl1 .fb-state{color:var(--accent)}
.fl0 .fb-fill{background:var(--bad)} .fl0 .fb-state{color:var(--bad)}
.fl1 .fb-fill{background:var(--warn)} .fl1 .fb-state{color:var(--warn)}
.fl2 .fb-fill{background:var(--ink-3)} .fl2 .fb-state{color:var(--ink-2)}
.fl3 .fb-fill,.fl4 .fb-fill{background:var(--good)} .fl3 .fb-state,.fl4 .fb-state{color:var(--good)}
.fl5 .fb-fill{background:var(--accent)} .fl5 .fb-state{color:var(--accent)}
.fl6 .fb-fill{background:linear-gradient(90deg,var(--good),var(--accent))} .fl6 .fb-state{color:var(--accent)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.chip.fit{color:var(--good);border-color:transparent;background:var(--good-soft)}
.chip.inj{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.chip.yel{color:var(--accent);border-color:transparent;background:var(--accent-soft);font-weight:600}
.chip.gold{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.chip.hot{color:var(--bad);border-color:var(--bad);font-weight:600}
/* dice */
.dice{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:620px){.dice{grid-template-columns:repeat(4,1fr)}}
.dcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.die{width:100%;max-width:72px;height:auto;display:block;overflow:visible;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
.die .face{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;transition:fill .3s,stroke .3s}
.die .edge{stroke:var(--dedge);stroke-width:1;fill:none}
.d20 .face{fill:var(--d20);stroke:var(--d20)} .d20 .edge{stroke:rgba(255,255,255,.35)} .d20 text{fill:var(--dnum)}
.d10 .face,.dN .face{fill:var(--d10)} .d10 text,.dN text{fill:var(--d10num)}
.die.evd .face{fill:var(--warn-soft);stroke:var(--warn)} .die.evd text{fill:var(--warn)}
.die text{font-family:var(--f-num);font-weight:500;text-anchor:middle;dominant-baseline:central}
.die.crit .face{fill:#8b3dff;stroke:#7026e8} .die.crit text{fill:#fff} .die.crit .edge{stroke:rgba(255,255,255,.35)}
.die.fumble .face{fill:#8f1d1d;stroke:#8f1d1d} .die.fumble text{fill:#fff} .die.fumble .edge{stroke:rgba(255,255,255,.35)}
.die.win .face{fill:var(--good);stroke:var(--good)} .die.win text{fill:#fff} .die.win .edge{stroke:rgba(255,255,255,.35)}
.die.lose .face{fill:var(--bad);stroke:var(--bad)} .die.lose text{fill:#fff} .die.lose .edge{stroke:rgba(255,255,255,.35)}
.die.mid .face{fill:var(--warn);stroke:var(--warn)} .die.mid text{fill:#fff} .die.mid .edge{stroke:rgba(255,255,255,.35)}
.die.dropped{opacity:.25}
.die .bp{fill:#000;opacity:var(--dshade,.12)}.d10 .bp,.dN .bp{opacity:var(--dshade2,.12)}.die.win .bp,.die.lose .bp,.die.mid .bp,.die.fumble .bp,.die.crit .bp{fill:#000;opacity:.13}
.d20 .edge{stroke:rgba(128,128,128,.5)}
.die.crit{overflow:visible;filter:drop-shadow(0 0 4px rgba(139,61,255,.4))}

.die .bq{fill:#000;opacity:calc(var(--dshade,.12)*.45)}.d10 .bq,.dN .bq{opacity:calc(var(--dshade2,.12)*.45)}
.die .bl{fill:#fff;opacity:var(--dlite,.1)}
.die.win .bq,.die.lose .bq,.die.mid .bq,.die.fumble .bq,.die.crit .bq{opacity:.06}.die.win .bl,.die.lose .bl,.die.mid .bl,.die.fumble .bl,.die.crit .bl{opacity:.12}
.die.adie.adie .face{fill:#f2b2c6;stroke:#f2b2c6}
.die.sdie.sdie .face{fill:#bba9ef;stroke:#bba9ef}
.die.adie.adie text,.die.sdie.sdie text{fill:#2a2230}
.die.adie.adie .edge,.die.sdie.sdie .edge{stroke:rgba(60,40,70,.28)}
.die.adie.adie .bp,.die.sdie.sdie .bp{opacity:.13}
.die.adie.adie .bq,.die.sdie.sdie .bq{opacity:.06}
.die.adie.adie .bl,.die.sdie.sdie .bl{opacity:.22}

.die.evd .face{fill:var(--d20);stroke:var(--d20)} .die.evd text{fill:var(--dnum)}
.dbtn{background:none;border:1px solid transparent;padding:8px 2px;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px;width:100%}
.dbtn:not(:disabled):hover{border-color:var(--rule)}
.dbtn:disabled{cursor:default}
.dbtn .lbl{font-size:10px;letter-spacing:.04em}
.hint{font-size:11px;color:var(--ink-3);min-height:1.2em}
.dicecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.dicecol .die{max-width:110px}

 rules:[['Start','You begin in your home country. South Americans go straight to the top flight unless their rolls are very poor. In Europe’s big leagues the top flight needs a high average, so most start in the second division.'],
  ['Season','The league is played in four stretches on the d20, with your domestic cup from the round of 16 and, if you qualified, the continental cup in between. A title needs a run of strong stretches; 4 heavy defeats can send any club down. Top 4 qualifies for the continental cup.'],
  ['Moments','Before some matches a moment comes up: a penalty, a free kick, a tackle and more. Roll that die plus your attribute ÷ 5. Win it and the match gets advantage or a bonus; lose it and you may play with disadvantage.'],
  ['Advantage','Roll two d20 and keep the best. Disadvantage keeps the worst.'],
  ['Each d20','d20 + player mod + club mod + the coach’s focus attribute ÷ 5, against a DC.'],
  ['Promotion','Finish top 4 in a second division and your club goes up. Small clubs that finish in the bottom 3 go down.'],
  ['Continental cups','After your first season, your own finish decides, whatever club you play for (a big first club starts in its continental cup): top 4 means the Champions League or Libertadores, 5th to 8th the Europa League or Sudamericana. Winning the national cup or a continental cup also earns a main-cup spot.'],
  ['Natural 1','Injury scare. Roll a d4: 3–4 you shake it off (past 30, only a 4). Otherwise roll 2d12 to recover: a natural 12 is fine, 8–11 out 1 match, 5–7 out 2, 2–4 out 3, 1 out for the season. Two 1s end your career.'],
  ['Natural 20','Wins any knockout match, and the focus attribute gets +1 at season’s end.'],
  ['Growth','+1 to everything each year until 22, then +3 spread out until 27. A high average d20 adds bonus points, and a hot season (average 13+) blocks decline. All growth stops after 33.'],
  ['Retirement','From the summer after your season at 32, roll d20 + a Physical bonus to keep playing (from −3 at Physical 4 up to +5 at 20). It gets harder every year. Reach 40 and you retire a legend of longevity. From 32 you can also retire whenever you like.'],
  ['Transfers and contracts','Your rating, titles and form decide who calls. Every offer comes with a wage and a contract of up to 4 years, and you can negotiate either. Under contract, a buying club must pay your club a fee or your release clause; your club may refuse. When a deal runs out your club decides whether to renew. Struggling players get loaned out, and there is a mid-season window too.'],
  ['World Cup','Every 4 years (2030, 2034…), halfway through the season. You’re called up if your rating is high enough for your nation; the favourites are the hardest squads to get into. Three group matches: win one and lose no more than one to reach the knockouts.'],
  ['Position','Your rolls decide it. Strikers score the most, wingers and attacking mids assist the most, and moments lean toward your position’s key stats.']],
 ev:{
  pen:['Late penalty','It’s level in the 88th minute and the ball is on the spot. You take it.','Bottom corner. The stadium erupts.','Saved. The momentum swings away.'],
  fk:['Free kick from 25 metres','The wall is set and the keeper shuffles across. This one is yours.','Over the wall and in.','It clips the wall and goes wide.'],
  oneone:['One-on-one','You’re through on goal with only the keeper to beat.','You round him and slot it home.','The keeper smothers it.'],
  tackle:['Last-ditch tackle','Their striker is clean through. You’re the last one back.','Perfect slide. Danger over.','You miss him, and they score.'],
  through:['The killer pass','A gap opens between their centre-backs for half a second.','Threaded through. Assist.','Overhit. The chance is gone.'],
  counter:['Counter-attack','Their corner is cleared and you have 60 metres of grass ahead.','You outrun everyone and square it for a tap-in.','Caught from behind.'],
  header:['Corner in the box','A big set piece. You attack the near post.','Powerful header, back of the net.','Outmuscled at the near post.'],
  derby:['Derby day','The biggest rivalry of the season. The fans want a hero.','You run the show.','You go missing and the rivals celebrate.'],
  training:['Extra training','The coach offers you an extra session before the match.','It pays off, and you get +1 to a random attribute at season’s end.','Nothing clicks today.'],
  press:['Press conference','The reporters are waiting for you before the match.','Your words rally the dressing room.','A clumsy answer becomes a headline.'],
  scout:['Scouts in the stands','Scouts from a bigger club are watching tonight.','They leave impressed. Expect stronger offers this window.','They leave at half-time.'],
  night:['Night out','Teammates invite you out two days before the match.','You stay home and rest.','You go out, and it shows on the pitch.'],
  crisis:['Dressing-room row','Two senior players are at each other’s throats before the match. Everyone looks at you.','You calm things down and the squad pulls together.','It spills onto the pitch.'],
  cwcgap:['The gap to the best','A final against the champions of Europe. Their squad is worth ten times yours, and everyone expects a thrashing.','The squad believes. You walk out ready to shock the world.','The gap shows early. You spend the night chasing the ball.']

}

/* ---------- Hall of Fame tags: how the career went ---------- */
const BLESS=11.6, CURSE=9.6;
function careerTags(){
  const H=S.history, out=[], rs=S.rs||{n:0,sum:0,n20:0,n1:0}, avg=rs.n?rs.sum/rs.n:10, fin=S.fin||{w:0,l:0};
  const clubs=[...new Set(H.map(h=>h.club))], inj=H.reduce((a,h)=>a+(h.injuries||0),0);
  const goals=H.reduce((a,h)=>a+h.goals,0), assists=H.reduce((a,h)=>a+h.assists,0);
  const peakAt=H.reduce((b,h)=>h.rating>b.rating?h:b,H[0]);
  Object.entries(S.clubPeak||{}).forEach(([c,lv])=>{if((S.legends||[]).some(l=>l.club===c))out.push(['legend',c]);else if(lv>=5&&H.filter(h=>h.club===c).length>=8&&H.filter(h=>h.club===c).reduce((a,h)=>a+h.trophies.filter(x=>x.kind!=='bdo').length,0)>=3)out.push(['idol',c])});
  (S.legends||[]).forEach(l=>{if(!out.some(x=>x[0]==='legend'&&x[1]===l.club))out.push(['legend',l.club])});
  if(rs.n>=50&&avg>=BLESS)out.push(['blessed']); else if(rs.n>=50&&avg<=CURSE)out.push(['cursed']);
  if(rs.n20>=12&&rs.n20/Math.max(1,rs.n)>=.062)out.push(['nat20s']);
  if(fin.w>=6&&fin.w>=fin.l*2)out.push(['biggame']); else if(fin.l>=4&&fin.l>fin.w)out.push(['bottler']);
  if(clubs.length>=8)out.push(['journeyman']);
  if(H.length>=10&&inj<=8)out.push(['iron']); else if(inj>=24)out.push(['glass']);
  const at25=H.find(h=>h.age===25);if(at25&&at25.rating<12&&peakAt.rating>=15)out.push(['late']); else if(H.some(h=>h.age<=21&&h.rating>=13.5))out.push(['prodigy']);
  if(H.length>=8&&goals/H.length>=20)out.push(['scorer']); else if(assists>=150&&assists>goals*1.5)out.push(['creator']);
  if((S.hatedAt&&(S.clubPeak||{})[S.hatedAt]>=4))out.push(['redemption']);
  if(S.watch)out.push(['generational']);
  if((S.captSeasons||0)>=5&&S.capt)out.push(['captain',S.capt.club]); else if((S.captSeasons||0)>=5)out.push(['captain','']);
  if((S.earn||0)>=15e7)out.push(['moneyman']);
  if((S.loans||0)>=2)out.push(['loanee']);
  if(S.endReason&&S.endReason.kind==='quit'&&S.endReason.age<30)out.push(['walkaway',String(S.endReason.age)]);
  if((S.chips||0)>=3)out.push(['chipper']);
  if(S.foot==='B'||(S.wf||0)>=5)out.push(['twofoot']);
  if((S.benchBackN||0)>=2)out.push(['fighter']);
  return out;
}

// which drawing a trophy uses (null: the plain gold cup)
function troKey(x){
  if(!x)return null; if(x.kind==='wc')return x.w?'wwc':'wc'; if(x.kind==='bdo')return'bdo'; if(x.kind==='cwc')return'cwc';
  const L=LEAGUES[x.lg]; if(!L)return null;
  if(x.kind==='cont')return /Libertadores/.test(L.cont||'')?'lib':L.cont==='Champions League'?'ucl':null;
  if(x.kind==='cont2')return !L.w&&/Libertadores/.test(L.cont||'')?'suda':L.cont==='Champions League'?'uel':null;
  if(x.kind==='cup')return L.c==='BRA'&&!L.w?'cdb':null;
  if(x.kind==='league')return L.c==='BRA'&&!L.w&&L.div===1?'bra':null;
  return null;
}

function rollDice(els,sides,finals,clsFn,done){
  if(!els.length){done();return}
  if(reduce){els.forEach((el,i)=>{setFace(el,finals[i]);const c=clsFn(finals[i]);if(c)el.classList.add(c)});setTimeout(done,150);return}

  sfx('roll',D,sides);

    const delay=i*70, dir=i%2?1:-1;
    el.classList.remove('crit','fumble','dropped');
    let cur=d(sides); setFace(el,cur);                       // numbers from the very first frame
    el.animate([
      {transform:'translateY(0) rotate(0deg) scale(1)'},
      {transform:`translateY(-9%) rotate(${dir*420}deg) scale(.92)`,offset:.45},
      {transform:`translateY(0) rotate(${dir*700}deg) scale(1.03)`,offset:.85},
      {transform:`translateY(0) rotate(${dir*720}deg) scale(1)`}
    ],{duration:D,delay,easing:'cubic-bezier(.2,.7,.25,1)'});

    const tick=ts=>{
      const e=ts-t0;

    };

  });
}

/* no "…" anywhere: text that would be cut is first made a little smaller, then allowed to wrap */
let ellSel=null;
function fitTexts(root){
  try{
    if(ellSel===null){const L=[];for(const sh of document.styleSheets){let rs;try{rs=sh.cssRules}catch(e){continue}
      const walk=list=>{for(const r of list){if(r.cssRules&&!r.selectorText)walk(r.cssRules);else if(r.style&&r.style.textOverflow==='ellipsis')L.push(r.selectorText)}};walk(rs)}
      ellSel=L.join(',')}
    if(!ellSel)return; const els=(root||document).querySelectorAll(ellSel);
    els.forEach(el=>{
      if(el.classList.contains('fn'))return;
      if(el.dataset.fit)el.style.fontSize='';
      const w=el.clientWidth; if(!w||el.scrollWidth<=w+1)return;
      const base=parseFloat(getComputedStyle(el).fontSize)||14, min=Math.max(9,base*.7); let fs=base;
      while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=.5;el.style.fontSize=fs+'px'}
      el.dataset.fit='1';
      if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace='normal';el.style.textOverflow='clip';el.style.overflow='visible';el.style.overflowWrap='anywhere'}
    });
    // label rows that must stay on one line (fan support / team level): shrink both texts together so the bars stay level
    (root||document).querySelectorAll('.fb-head').forEach(h=>{const kids=[...h.children];kids.forEach(k=>k.style.fontSize='');
      let guard=0;while(h.scrollWidth>h.clientWidth+1&&guard++<12){kids.forEach(k=>{const f=parseFloat(getComputedStyle(k).fontSize);if(f>7.5)k.style.fontSize=(f-.5)+'px'})}});
  }catch(e){}
}

/* ---- crit tables: a d12 (two faces per outcome) decides what a natural 20 or a natural 1 turns into ---- */

  const c=[];LEAGUES.forEach((L,Li)=>L.tiers.forEach((tr,ti)=>{if(gOK(L)&&!L.exotic&&eff>=tr.min&&tr.pr>=best-(boost>1?0:1))tr.clubs.forEach(n=>{if(!have.has(n))c.push({name:n,league:Li,tier:ti,pr:tr.pr})})}));

/* ================= contracts: wages, lengths, release clauses, fees, loans ================= */
/* one world currency, estimated in euros and always shown with $ */
const roundMoney=v=>{v=Math.max(0,+v||0);if(v>=1e6)return Math.max(1e6,Math.round(v/25e4)*25e4);if(v>25e3)return Math.round(v/25e3)*25e3;if(v>=1e3)return Math.round(v/1e3)*1e3;return Math.round(v/100)*100};
/* values are euros; the player picks how they are shown */
const CUR={eur:{r:1,f:n=>n+'\u00a0€'},usd:{r:1.12,f:n=>n+'\u00a0$'},brl:{r:5.59,f:n=>'R$\u00a0'+n}};
let curK=(()=>{try{const v=localStorage.getItem('rpgoal-cur2');return CUR[v]||v==='auto'?v:'auto'}catch(e){return'auto'}})();
const EURO_X=new Set(['BEL','CRO','SUI','SRB','POL','DEN','SWE','NOR','AUT','SCO','WAL','IRL','TUR','UKR','CZE','GRE','RUS','HUN','ROU','SVK','SVN','ISL','FIN','ALB','BIH','NIR']);
// Brazil pays in reais, Europe in euros, everywhere else in dollars
const curAuto=()=>{try{const c=S&&S.club&&LEAGUES[S.club.league]?LEAGUES[S.club.league].c:S&&S.nat;return c==='BRA'?'brl':(CONF[c]==='UEFA'||EURO_X.has(c))?'eur':'usd'}catch(e){return'eur'}};
const curEff=()=>curK==='auto'?curAuto():curK;
const niceCur=v=>v>=1e8?Math.round(v/1e6)*1e6:v>=1e7?Math.round(v/1e5)*1e5:v>=1e6?Math.round(v/5e4)*5e4:v>=1e5?Math.round(v/5e3)*5e3:v>=1e4?Math.round(v/1e3)*1e3:v>=1e3?Math.round(v/100)*100:Math.round(v/10)*10;
const money=v=>{const C=CUR[curEff()]||CUR.eur;v=niceCur((+v||0)*C.r);const f=(x,u)=>String(Math.round(x*100)/100).replace('.',lang==='pt'?',':'.')+u;return C.f(v>=1e9?f(v/1e9,'B'):v>=1e6?f(v/1e6,'M'):v>=1e3?f(v/1e3,'k'):String(Math.round(v)))};
/* wages are stored per year; the player picks how to read them */
const wageDiv=()=>wagePer==='wk'?52:wagePer==='mo'?12:1;
const wageAmt=v=>money(roundMoney((+v||0)/wageDiv()));
const wage=v=>wageAmt(v)+t.per[wagePer];
const myPr=()=>tierOf(S.club.league,S.club.tier).pr;
const tierMinOf=(Li,ti)=>tierOf(Li,ti).min;
const bigSignCred=()=>S.trophies.filter(x=>x.kind==='bdo').length>=1||S.trophies.filter(x=>x.kind==='wc').length>=1||S.trophies.filter(x=>x.kind==='cont').length>=2;
/* what a club pays: its level sets the base, your rating against the squad's level moves it */
function wageFor(Li,ti,opts={}){
  const L=LEAGUES[Li], tr=tierOf(Li,ti), r=opts.rating!=null?opts.rating:rating(S.attrs);
  let base=L.w?6e3*Math.pow(1.9,tr.pr):50e3*Math.pow(2.2,tr.pr);
  if(L.exotic)base*=L.c==='KSA'?40:16;
  if(L.c==='USA'&&!L.w)base*=.55;   // the MLS pays well, but below Europe's biggest leagues
  if(L.c==='ESP'&&!L.w)base*=.7;   // Spanish clubs pay below English ones; Real Madrid and Barcelona still sit with the Premier League's best
  let f=clamp(Math.pow(1.45,r-(tr.min+1.5)),.3,4)*(1+Math.min(.5,.15*S.trophies.filter(x=>x.kind==='bdo').length));
  if(S.age>=32)f*=.85;
  f*=1+.05*Math.max(0,wfLv()-2);   // a good weak foot is worth money
  f*=1+(S.fame||0)/300;   // and so is a famous name
  return roundMoney(base*f*.75*(opts.mult||1));
}
const mvMult=a=>a<=24?8:a<=28?6.5:a<=31?4:2;
const marketValue=()=>roundMoney(wageFor(S.club.league,S.club.tier)*mvMult(S.age));
const clauseFor=w=>roundMoney(w*mvMult(S.age)*2.5);
const yearsLeft=()=>S.contract?S.contract.until-S.year:0;
const lenFor=()=>S.age<=23?pick([3,4,4]):S.age<=28?pick([2,3,4]):S.age<=31?pick([2,2,3]):pick([1,1,2]);
function signContract(club,wage,years,startYear){
  const prevClub=S.contract&&S.contract.club;
  S.contract={club:club.name,wage,until:startYear+years-1,clause:clauseFor(wage),from:startYear};
  S.wageMax=Math.max(S.wageMax||0,wage);
  if(prevClub===club.name){S.renewals=S.renewals||{};S.renewals[club.name]=(S.renewals[club.name]||0)+1}
}
/* how badly a club wants you, remembered between windows */
function interestOf(n){S.interest=S.interest||{};if(!S.interest[n])S.interest[n]={ref:0,keen:Math.random()<.3?1:0,ban:0};return S.interest[n]}
function decorateOffer(o,mid){
  const I=interestOf(o.name), up=o.pr-myPr();
  o.want=clamp(1+(up>=1?1:0)+(I.keen&&I.ref?1:0)+(Math.random()<.25?1:0),1,3);
  o.keen=I.keen&&I.ref>=1?1:0;
  o.years=o.loan?1:lenFor();
  o.wage=o.loan?S.contract.wage:wageFor(o.league,o.tier,{mult:1+.12*(o.want-1)+(o.keen?.2*I.ref:0)+(o.rival?.25:0)});
  if(o.mode||o.loan||S.lockedIn){o.fee=0;o.feeKind=o.loan?'loan':'free';return o}
  const yl=mid?yearsLeft()+1:yearsLeft(), lastH=S.history[S.history.length-1];
  if(!S.contract||yl<=0||(lastH&&(lastH.fired||lastH.released)&&!mid)){o.fee=0;o.feeKind='free';return o}
  const mv=marketValue(), L=LEAGUES[o.league], budget=(L.w?.15e6:1e6)*Math.pow(2.3,o.pr)*(L.exotic?20:1);
  const bid=mv*(.7+.5*Math.random())*(1+.15*(o.want-1));
  const rt=roleTier(roleNow()), idol=fanTier()>=5;   // stars are expensive to prise away; surplus players go cheap
  const thr=mv*(1+(yl-1)*.15+[-.5,-.3,0,.1,.3,.5][rt]+(idol?.4:0));
  const I2=interestOf(o.name);
  if(budget>=S.contract.clause&&((up>=1.5&&o.want>=3&&Math.random()<.3)||(o.keen&&I2.ref>=2&&Math.random()<.25)||(up>=1&&S.contract.clause<=budget*.08&&Math.random()<.7))){o.fee=S.contract.clause;o.feeKind='clause'}
  else if(bid>=thr){o.fee=roundMoney(bid);o.feeKind='deal'}
  else{o.fee=roundMoney(bid);o.feeKind='blocked';o.blocked=1;o.thr=roundMoney(thr)}
  return o;
}
/* clubs that keep coming back, rivals trying to lure you, clubs that give up */
function contractOffers(h,res){
  S.interest=S.interest||{};
  res=res.filter(o=>!interestOf(o.name).ban);
  const cur=clubAfterMove(h);
  Object.entries(S.interest).forEach(([n,I])=>{
    if(!I.keen||I.ban||I.ref<1||res.some(o=>o.name===n)||n===S.club.name||Math.random()>.45)return;
    const ci=(isW()?CLUB_INFO_W:CLUB_INFO_M)[n]; if(!ci||!gOK(LEAGUES[ci.league]))return;
    if(rating(S.attrs)<tierOf(ci.league,ci.tier).min-.5)return;
    res.push({name:n,league:ci.league,tier:ci.tier,pr:ci.pr,back:1});
  });
  // a rival with deep pockets tries to take their neighbour's key player
  if(!S.lockedIn&&!h.fired&&rating(S.attrs)>=tierMinOf(cur.league,cur.tier)+2&&Math.random()<.25){
    const L=LEAGUES[cur.league], riv=[];L.tiers.forEach((tr,ti)=>tr.clubs.forEach(n=>{if(isRival(S.club.name,n)&&!interestOf(n).ban)riv.push({name:n,league:cur.league,tier:ti,pr:tr.pr})}));
    if(riv.length&&!res.some(o=>riv.some(r=>r.name===o.name))){const r=pick(riv);r.rival=1;if(res.length>=3)res[res.length-1]=r;else res.push(r)}
  }
  return res.slice(0,3).map(o=>decorateOffer(o));
}
/* the window closed: every club you did not choose remembers it */
function noteRefusals(chosen){
  (S.offers||[]).forEach(o=>{
    if(o.loan||o.blocked||o.mode||(chosen&&o.name===chosen.name))return;
    const I=interestOf(o.name); I.ref++;
    if(!I.keen&&I.ref>=2){I.ban=1;(S.gaveUp=S.gaveUp||[]).push(o.name)}
  });
}
/* when your deal runs out the club decides whether to keep you */
function renewalFor(h){
  const r=rating(S.attrs), min=tierMinOf(S.club.league,S.club.tier);
  const rt=roleTier(roleNow()), want=fanTier()>=5||rt>=3||(rt>=1&&r>=min-.5&&!(S.age>=33&&r<min+1.5));   // the club keeps the players it counts on
  if(!want||h.fired||(rt===0&&fanTier()<5))return{none:1};
  const yrs=S.age<=26?pick([3,4]):S.age<=30?pick([2,3]):1;
  return{wage:wageFor(S.club.league,S.club.tier,{mult:(fanTier()>=5?1.1:1)*(1+.05*Math.min(S.tenure||0,10))*(1+.04*(S.board||0))*(1+.06*Math.max(0,rt-3))}),years:yrs,want:fanTier()>=4||rt>=4?3:2};
}
/* season end: pay day, the clause grows, deals end, loans come back */
function contractSeasonEnd(h){
  if(!S.contract)return;
  S.earn=(S.earn||0)+S.contract.wage;
  S.contract.clause=Math.max(S.contract.clause,clauseFor(wageFor(S.club.league,S.club.tier)));
  const ln=S.contract.loan;
  if(ln&&S.year>=ln.back){h.loanEnd=1;h.loanClub=S.club.name}
  if(S.contract.until<=S.year){h.expired=1;
    if(ln){delete S.contract.loan;h.loanEnd=0;S.renew=renewalFor(h);if(S.renew.none){h.released=1;S.releasedN=(S.releasedN||0)+1}}   // the parent deal ran out: the loan club may keep you
    else{S.renew=renewalFor(h);if(S.renew.none){h.released=1;S.releasedN=(S.releasedN||0)+1}}
  }else{S.renew=null;
    // an underpaid star gets a new deal before the vultures circle
    const mk=wageFor(S.club.league,S.club.tier);
    if(!ln&&!h.fired&&mk>=S.contract.wage*1.8&&fanTier()>=2&&Math.random()<.6)S.renew={wage:mk,years:Math.max(yearsLeft(),lenFor()),want:2,early:1};
  }
  // underperforming young players get sent out on loan
  if(!h.fired&&!h.released&&!ln&&yearsLeft()>0&&S.age<=29&&rating(S.attrs)<tierMinOf(S.club.league,S.club.tier)-.7&&Math.random()<.65){
    const lo=loanTarget(); if(lo){h.loanOffer=1;S.loanOffer=lo}
  }
}
function loanTarget(){
  const pr=myPr(), eff=rating(S.attrs), c=[];
  LEAGUES.forEach((L,Li)=>L.tiers.forEach((tr,ti)=>{if(gOK(L)&&!L.exotic&&tr.pr<pr-.4&&tr.pr>=pr-2.5&&eff>=tr.min-.3)tr.clubs.forEach(n=>{if(n!==S.club.name)c.push({name:n,league:Li,tier:ti,pr:tr.pr})})}));
  if(!c.length)return null; c.sort((a,b)=>b.pr-a.pr);
  const o=pick(c.slice(0,8)); o.loan=1; o.fee=0; o.feeKind='loan'; o.wage=S.contract?S.contract.wage:0; o.years=1; return o;
}
/* joining a club, at the start of a season or in the middle of one */
function joinClub(club,last,notes){
  const from=S.club.name, hadL=S.loyalty||0;
  let L=0; const mode=club.mode;
  if(!(last&&last.fired)&&!mode&&!club.loan)S.hops=(S.hops||0)+1;
  if(!mode&&!club.loan&&S.hops>=3){L-=2*(S.hops-2);notes.push(['nMerc'])}
  // the fans of the club you leave remember how much they loved you (and that you left with years still on your deal)
  S.clubLoy=S.clubLoy||{}; S.clubLoy[from]={loy:hadL-(club.pushed?3:club.fee>0&&club.feeKind!=='free'?1:0),idol:fanTier()>=5};
  if(club.pushed)notes.push(['nPushed',from]);
  if(mode==='any'){S.hops=0;S.lockedIn=true;notes.push(['nAny',club.name])}
  const back=returnInfo(club.name);
  if(back){
    S.hops=0;
    if(back.rival){L=-3;notes.push(['nRivalBack',club.name,back.rival])}
    else{L=(back.loy!=null?back.loy:3)+3;notes.push([mode==='home'?'nHome':'nBack',club.name])}
  }else if(mode==='home'){L=6;S.hops=0;notes.push(['nHome',club.name])}
  if(S.parent&&(S.parent.idols||[]).includes(club.name)&&!back){L+=6;notes.push(['nHeir',club.name])}
  if(isRival(from,club.name)){L-=4+(hadL>=7?3:0);S.rivalMoves=(S.rivalMoves||0)+1;notes.push(['nRival',from,club.name])}
  // a decorated player arrives as a big signing; a framed unveiling shirt keeps the welcome warm
  if(!back&&!club.loan&&!mode&&bigSignCred()){L+=3;S.roleBoost=10;S.bigSign=(S.bigSign||0)+1;notes.push(['nBigSign',club.name]);giveItem('unveil')}
  if(hasItem('unveil')&&!back)L+=1;
  if(club.fee>0&&club.feeKind!=='free'&&club.feeKind!=='loan'){S.fees=(S.fees||[]).concat({fee:club.fee,year:S.year,from,to:club.name,kind:club.feeKind});S.feeMax=Math.max(S.feeMax||0,club.fee);if(club.feeKind==='clause')S.clausePaid=(S.clausePaid||0)+1;notes.push([club.feeKind==='clause'?'nClause':'nFee',club.name,money(club.fee)])}
  if(club.loan){S.loans=(S.loans||0)+1;notes.push(['nLoan',club.name,from])}
  S.board=0; S.wantOut=0;
  S.loyalty=Math.min(25,L); S.tenure=0; S.legend=(S.legends||[]).some(l=>l.club===club.name)?club.name:null;
  S.club={name:club.name,league:club.league,tier:club.tier}; S.capt=null;
}
/* ---- the mid-season window ---- */
function midCheck(s){
  if(s.midDone||S.lockedIn||!S.contract)return; s.midDone=1;
  const lg=s.stages.filter(x=>x.comp==='league'&&x.res&&!x.res.skipped), good=lg.filter(x=>x.res.kind<=1).length, bad=lg.filter(x=>x.res.kind>=3).length;
  const r=rating(S.attrs), min=tierMinOf(S.club.league,S.club.tier);
  if(s.out>0||s.seasonOut)return;
  if(r>=min+2&&good>=1&&bad===0&&Math.random()<.45){
    const h={pos:3,trophies:[],goals:0,scout:s.scout};const base=makeOffers(h).filter(o=>o.pr>=myPr()+.5&&!o.money);
    const all=base.slice(0,2).filter(o=>!interestOf(o.name).ban).map(o=>decorateOffer(o,true)), offers=all.filter(o=>!o.blocked);
    all.filter(o=>o.blocked).forEach(o=>(S.notes=S.notes||[]).push(['nBidNo',S.club.name,o.name,money(o.fee)]));
    if(offers.length)s.mid={kind:'offers',offers};
  }else if(S.contract.loan==null&&S.age<=29&&(r<min-.6||bad>=2)&&Math.random()<.5){
    const lo=loanTarget(); if(lo)s.mid={kind:'loan',offers:[lo]};
  }
}
function midMove(o){
  const s=S.season, notes=[];
  // cup-tied: the cups you already played this season stay with your old club
  s.stages.forEach((x,i)=>{if(i>=s.idx&&!x.res&&['cup','cont','cont2','cwc'].includes(x.comp))x.res={skipped:true,tied:1}});
  const parent={name:S.club.name,league:S.club.league,tier:S.club.tier};
  joinClub(o,null,notes);
  if(o.loan)S.contract.loan={...parent,back:S.year};
  else signContract(o,o.wage,o.years,S.year);
  s.midFrom=parent.name; s.midLoan=o.loan?1:0;
  S.notes=(S.notes||[]).concat(notes);
  s.mid=null;
}
function ensureContract(){if(S&&S.club&&S.phase!=='create'&&S.phase!=='retired'&&!S.contract){signContract(S.club,wageFor(S.club.league,S.club.tier),2,S.year)}}
function maybeMid(){
  if(view!=='game'||S.phase!=='season'||!S.season||!S.season.mid||ovHas('mid'))return;
  if(S.season.last)return;
  ovQ.push({k:'mid'});
}
/* ---- contract UI: offer terms, negotiating, asking to leave, loans ---- */
const termsLine=o=>`<span class="wterms"><span class="wamt num">${wageAmt(o.wage)}<small>${t.per[wagePer]}</small></span><span class="wlen">${o.loan?t.loanLen:t.contractLen(o.years)}</span>${!o.loan&&S.contract&&S.contract.wage&&o.wage?`<span class="wpct ${o.wage>=S.contract.wage?'up':'down'}">${t.vsNow(`${o.wage>=S.contract.wage?'+':'−'}${Math.abs(Math.round((o.wage/S.contract.wage-1)*100))}%`)}</span>`:''}</span>`;
const feeTag=o=>o.feeKind==='clause'?`<span class="wtag">${t.feeClause(money(o.fee))}</span>`:o.feeKind==='deal'?`<span class="wtag dim">${t.feeDeal(money(o.fee))}</span>`:o.feeKind==='blocked'?`<span class="wtag bad">${t.feeBlocked(money(o.fee))}</span>`:o.feeKind==='loan'?`<span class="wtag">${t.loanTag}</span>`:`<span class="wtag dim">${t.feeFree}</span>`;
const offerExtraTags=o=>(o.keen?`<span class="wtag">${t.keenTag}</span>`:'')+(o.rival&&!isRival(S.club.name,o.name)?'':'')+(bigSignCred()&&!o.loan&&!o.mode&&!returnInfo(o.name)?`<span class="wtag">${t.bigSignTag}</span>`:'');
function contractRowHTML(h){
  const C=S.contract; if(!C)return'';
  if(h.loanEnd&&C.loan)return '';
  if(S.renew&&!S.renew.none)return `<span class="wsub">${t.renewOffer(wage(S.renew.wage),t.yrsN(S.renew.years))}</span>`;
  if(S.renew&&S.renew.none)return '';
  return `<span class="wsub">${t.underContract(Math.max(1,C.until-S.year),wage(C.wage))}</span>`;
}

/* ---- asking to leave: someone always tries to talk you out of it ---- */
const LEAVE_SC={
  demo:{w:()=>fanTier()>=3?3:0,dc:2,push:-3,stay:2},
  ultras:{w:()=>fanTier()>=4?2:0,dc:1,push:-3,stay:2},
  letter:{w:()=>2,dc:0,push:-2,stay:1},
  pres:{w:()=>fanTier()>=2?2:1,dc:-1,push:-2,stay:1},
  presPay:{w:()=>yearsLeft()>=1?2:0,dc:0,push:-2,stay:1,pay:1},
  mate:{w:()=>2,dc:0,push:-2,stay:1},
  coach:{w:()=>rating(S.attrs)>=tierMinOf(S.club.league,S.club.tier)?2:1,dc:1,push:-2,stay:1},
  legend:{w:()=>(S.tenure||0)>=2||fanTier()>=3?1.5:0,dc:0,push:-2,stay:1},
  board:{w:()=>fanTier()<=3?2:.5,dc:0,push:-2,stay:0}
};
function leaveScenario(x){
  if(x.sc&&LEAVE_SC[x.sc.k])return x.sc;
  const ks=Object.keys(LEAVE_SC), ws=ks.map(k=>LEAVE_SC[k].w()), tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot, k=ks[0]; for(let i=0;i<ks.length;i++){r-=ws[i];if(r<=0){k=ks[i];break}}
  const sc={k};
  if(k==='letter'){sc.n=randomName(S.nat,Math.random()<.5?'f':'m').split(' ')[0];sc.a=7+Math.floor(Math.random()*6)}
  if(k==='mate'||k==='legend')sc.n=randomName(S.nat);
  if(k==='presPay')sc.pay=roundMoney(S.contract.wage*(1.25+Math.random()*.35));
  x.sc=sc; return sc;
}

function modChips(st,pm,cm,kb,fx,teamChip,ex){
  const s=S.season, loy=st.comp==='wc'?0:loyBonus(), exs=ex.reduce((a,x)=>a+x[1],0);
  const raw=pm+cm+kb+(fx.buff||0)+loy+exs, c=capMods(raw,st), md=effMode(st);
  return `<span class="chip" title="${t.chPlayer}">${t.chPlayer} ${sg(pm)}</span><span class="chip">${teamChip}</span><span class="chip yel" title="${t.chFocus}">${t.attrs[st.key]} ${sg(kb)}</span>`
   +(fx.buff?`<span class="chip ${fx.buff>0?'fit':'inj'}">${t.moment} ${sg(fx.buff)}</span>`:'')
   +(loy?`<span class="chip ${loy>0?'gold':'inj'}">${t.fans} ${sg(loy)}</span>`:'')
   +(()=>{const pos=ex.filter(x=>x[1]>0),neg=ex.filter(x=>x[1]<0),ps=pos.reduce((a,x)=>a+x[1],0);return (ps?`<span class="chip fit" title="${pos.map(([k,v])=>t.xm[k]+' '+sg(v)).join(' · ')}">${pos.length===1?t.xm[pos[0][0]]:t.extrasL} ${sg(ps)}</span>`:'')+neg.map(([k,v])=>`<span class="chip inj">${t.xm[k]} ${sg(v)}</span>`).join('')})()
   +(c!==raw?`<span class="chip yel">${t.modsCap(c,raw)}</span>`:'')
   +(s.hot>0?`<span class="chip hot">${t.hotChip(s.hot)}</span>`:'')
   +(st.red?`<span class="chip inj">${t.redChip}</span>`:'')
   +(st.insp?`<span class="chip gold">✦ ${t.inspOn}</span>`:'')
   +`<span class="chip">${t.dc} ${dcFor(st)}</span>`;
}
function prepView(h){
  const out=[];

    else out.push(`<div class="prepdone">★ ${t.featGot(t.feats[h.feat][0])}</div>`);
  }
  if(S.age<40){
    if(!h.camp){if(!h.featDue||h.feat)out.push(`<div class="prep"><span class="lbl">${t.campT}</span><div class="muted small">${t.campSub}</div><div class="prepg">${['train','rest','media','nat'].map(k=>`<button class="prepb" data-act="camp" data-k="${k}"><b>${t.camp[k][0]}</b><span>${t.camp[k][1]}</span></button>`).join('')}</div></div>`)}

  }

}

    const ws=base.split(/[\s\-\/]+/).filter(Boolean), sig=ws.filter(w=>!CODE_SKIP.has(w.toLowerCase())&&!/^\d+$/.test(w)), W=(sig.length?sig:ws).map(strip).filter(Boolean);

 howTo:[['Your player','Roll 8d10 for your attributes and choose a position. The colors show how well each position suits your dice; playing out of position costs a point in every match.'],
  ['Matches','Each phase of the season is one d20 roll plus your bonuses against a DC. The panel shows what you need and your chance. A natural 20 always wins; a natural 1 is an injury scare.'],
  ['Moments and stories','Before some matches a moment or a story appears. Pick an option and roll: success gives you advantage or a bonus, failure the opposite.'],
  ['The league','The league is played in blocks of rounds (10, 9, 8 and 8 matches): the dice roll one after another and turn blue for a win, yellow for a draw and red for a loss. Home games give +1. Momentum builds with a run: three wins in a row +1, five +2, seven +3, and every natural 20 adds +1 more; a losing run costs up to −3. A draw resets it to zero, and a defeat ends any good run. It never goes past ±3, and two rivalry matches stop for a derby check. The last three rounds are the final push, rolled one by one with the table in front of you. Win 3 points, draw 1: the Season tab shows the full table.'],
  ['Cups','Cups and continental knockouts are single rolls: ties go to a last-minute chance and penalties. Continental group stages are six quick games, home and away.'],

  ['Transfers','Every summer clubs make offers with a wage and a contract. Under contract, they must pay your club. You can negotiate, ask to leave, or ask for a new deal from the Contract tab.'],

  ['Jogos','Cada fase da temporada é uma rolagem de d20 mais seus bônus contra uma CD. O painel mostra o que você precisa e sua chance. Um 20 natural sempre vence; um 1 natural é um susto de lesão.'],
  ['Momentos e histórias','Antes de alguns jogos aparece um momento ou uma história. Escolha uma opção e role: o sucesso dá vantagem ou bônus, a falha o contrário.'],
  ['A liga','A liga é jogada em blocos de rodadas (10, 9, 8 e 8 jogos): os dados rolam um depois do outro e ficam azuis na vitória, amarelos no empate e vermelhos na derrota. Jogos em casa dão +1. O embalo cresce com a sequência: três vitórias seguidas +1, cinco +2, sete +3, e cada 20 natural soma +1; uma sequência de derrotas tira até −3. Um empate zera o embalo, e uma derrota encerra qualquer boa fase. Nunca passa de ±3, e dois clássicos param para um teste de clássico. As três últimas rodadas são a reta final, roladas uma a uma com a tabela à vista. Vitória vale 3 pontos, empate 1: a aba Temporada mostra a tabela completa.'],
  ['Copas','Copas e mata-matas continentais são uma rolagem só: empates vão para uma chance no último minuto e para os pênaltis. As fases de grupos continentais são seis jogos rápidos, em casa e fora.'],
  ['Evolução','Você melhora a cada temporada até perto dos 30, mais tempo com um corpo forte, até um teto definido pelos dados e pelo seu potencial. No terceiro nível você pode mudar de posição. A partir dos 32, o corpo decide a cada verão se você continua.'],
  ['Transferências','Todo verão clubes fazem propostas com salário e contrato. Com contrato, eles precisam pagar ao seu clube. Dá para negociar, pedir para sair ou pedir um contrato novo na aba Contrato.'],

function swansong(res,h){
  if(S.age<32||S.lockedIn)return;
  if(!isW()&&!isExotic(S.club.league)&&!res.some(o=>o.money)&&rating(S.attrs)>=12&&Math.random()<.45){
    const Li=Math.random()<.5?20:21, ti=Math.random()<.5?2:1, o={name:pick(LEAGUES[Li].tiers[ti].clubs),league:Li,tier:ti,pr:LEAGUES[Li].tiers[ti].pr,money:1};
    if(res.length>=3)res[res.length-1]=o; else res.push(o);
  }
  const f=firstClub();
  if(f&&f.name!==S.club.name&&!res.some(o=>o.name===f.name)&&Math.random()<.4){
    const ret=returnInfo(f.name); if(ret&&ret.rival)return;

/* ---- the next generation: play the son or daughter of a retired player ---- */
function heirOf(P){
  const idols=new Set((P.legends||[]).map(l=>l.club));
  Object.entries(P.clubPeak||{}).forEach(([c,v])=>{if(v>=5)idols.add(c)});
  Object.entries(P.clubLoy||{}).forEach(([c,m])=>{if(m&&m.idol)idols.add(c)});
  const A=P.attrs||{}, best=AK.slice().sort((a,b)=>(A[b]||0)-(A[a]||0))[0];
  const nm=String(P.name||'').trim().split(/\s+/);
  return{name:P.name||'',g:P.gender==='f'?'f':'m',nat:P.nat,last:nm.length>1?nm[nm.length-1]:pick((NATIONS[P.nat]||NATIONS.BRA).last),idols:[...idols],best,gen:((P.parent&&P.parent.gen)||1)+1,
    childYear:heirYear(P),clubs:[...new Set((P.history||[]).map(h=>h.club))].slice(0,6),peak:Math.max(...(P.history||[{rating:0}]).map(h=>h.rating))};
}
/* born when the parent was somewhere between 24 and 36, and never before the parent has retired */
function heirYear(P){const H=P.history||[], born=(H.length?H[0].year:(P.startYear||2027))-17, last=H.length?H[H.length-1].year:2027;return Math.max(last+1,born+24+Math.floor(Math.random()*13)+17)}

function decideKids(){if(S.kids!==undefined||S.phase!=='retired'||!S.history||!S.history.length)return;const r=Math.random(), w=!!(NATIONS[S.nat]&&NATIONS[S.nat].firstW);
  S.kids=r<.1?[w&&Math.random()<.4?'f':'m']:r<.11&&w?['m','f']:[];if(typeof save==='function')try{save()}catch(e){}}
function heirName(g){const N=NATIONS[S.nat]||NATIONS.BRA, list=(g==='f'&&N.firstW)?N.firstW:N.first;return pick(list)+(S.parent&&S.parent.last?' '+S.parent.last:'')}
function heirOffers(out){
  if(!S.parent||!out)return out;
  const info=isW()?CLUB_INFO_W:CLUB_INFO_M, c=(S.parent.idols||[]).find(n=>info[n]&&!out.some(o=>o.name===n));
