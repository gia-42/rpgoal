<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a clean match report. Single column, hairline rules, generous white space; the d20 is the one solid accent, everything else is ink on paper. */
:root{
  --bg:#f7f7f5; --card:#ffffff; --sunk:#f2f3f1; --ink:#15171c; --ink-2:#4a4f5c; --ink-3:#8a8f9b; --rule:#e2e3e0; --rule-2:#cfd1cc;
  --accent:#3346d3; --accent-soft:#eceefc; --on-accent:#ffffff;
  --good:#1f63d6; --good-soft:#e8f0fd; --bad:#c23a2e; --bad-soft:#fbeceb; --warn:#a86512; --warn-soft:#fbf1e3;
  --d20:#2b2e35; --dnum:#ffffff; --d10:#ffffff; --d10num:#15171c; --dedge:rgba(21,23,28,.35);
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416;
  --d20:#d5d8de; --dnum:#15171c; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416;
  --d20:#d5d8de; --dnum:#15171c; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-ui);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600;line-height:1.15}
.lbl{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--ink-3);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.mark{font-weight:600;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark b{color:var(--accent);font-weight:600}
.mark svg{width:22px;height:22px;flex:none}
.mark svg{width:24px;height:24px}
.top .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langs{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.langs button{background:transparent;border:0;color:var(--ink-3);font-size:12px;font-weight:600;padding:5px 9px;letter-spacing:.03em}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule-2);border-radius:7px;color:var(--ink-2);font-size:12px;font-weight:600;padding:5px 9px}
.theme-btn svg{width:14px;height:14px}
.theme-btn.icon{padding:5px 7px}
.setw{position:relative}
.setmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px;font-size:14px;color:var(--ink)}
.setrow+.setrow{border-top:1px solid var(--rule)}
.setrow .theme-btn .tl{display:inline!important}
.setrow .langs button{padding:4px 9px;font-size:12px}
.theme-btn.icon svg path:first-child{fill:currentColor;fill-opacity:.15}
.theme-btn svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;border-bottom:1.5px solid transparent;color:var(--ink-3);font-weight:500;font-size:14.5px;padding:8px 12px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* panels */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}
.panel.hero{border-color:var(--rule-2)}
/* player sheet */
.who{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.who h2{font-size:26px}
.rating{text-align:right}
@media (max-width:520px){.rating{text-align:left}}
.rating .big{font-family:var(--f-num);font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em}
.pos{display:inline-flex;align-items:center;gap:8px}
.pos .ab{font-family:var(--f-num);font-weight:500;font-size:11px;border:1px solid var(--ink);padding:1px 6px;border-radius:4px;line-height:1.5}
.abil{display:grid;grid-template-columns:repeat(8,1fr);margin-top:18px;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
@media (max-width:620px){.abil{grid-template-columns:repeat(4,1fr)}}
.ab-cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.ab-cell .lbl{font-size:9.5px;letter-spacing:.01em;max-width:100%;line-height:1.25;white-space:nowrap}
@media (max-width:420px){.ab-cell .lbl,.pickbtn .lbl{font-size:8.5px;letter-spacing:0}}
.lshort{display:none} .l3{display:none}
@media (max-width:360px){.lfull{display:none}.lshort{display:inline}}
.ab-v{font-family:var(--f-num);font-weight:500;font-size:24px;line-height:1.1}
.ab-m{font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.gain,.loss{font-family:var(--f-num);font-size:11px;font-weight:600;vertical-align:super;margin-left:2px;line-height:0}
.gain{color:var(--good)} .loss{color:var(--bad)}
/* fan support */
.fanbar{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fb-state{font-size:13px;font-weight:600}
.fb-track{position:relative;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden}
.fb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .6s ease,background .3s}
.fb-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.9}
.fb-scale{position:relative;height:15px;font-size:10.5px;color:var(--ink-3)}.fb-scale span{position:absolute;top:0;white-space:nowrap}.fb-scale span:nth-child(2){transform:translateX(-50%)}.fb-scale span:last-child{right:0}
.teambar{margin-top:10px}
.bars .teambar{margin-top:10px}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.numgrid>div{background:var(--card);padding:7px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.numgrid .lbl{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numgrid b{font-family:var(--f-num);font-weight:500;font-size:17px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:13.5px}
.crow:first-child{border-top:0}
.crow .yr{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3)}
.crow .cl{display:flex;align-items:center;gap:6px;min-width:0}
.crow .cl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cl .muted{font-size:12px;white-space:nowrap}
.crow .nm{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.crow .cups{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.crow .cups .cup,.crow .cups .chip{font-size:11px;padding:1px 6px}
.sv-card{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sv-big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sv-chips{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:12.5px;margin-top:6px}
.sv-list{display:flex;flex-direction:column}
.sv-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.sv-row:first-child{border-top:0}
.tabs{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.onepage{height:100vh;height:100dvh;overflow:hidden}
.onepage .wrap{height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:12px}
.onepage .wrap>*{flex:none}
.onepage .wrap>.panel.hero{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.onepage .wrap>.panel.hero>.stage{margin:auto 0}
.onepage .panel{padding:14px 16px}
.onepage .who h2{font-size:22px}
.onepage .rating .big{font-size:30px}
.onepage .fanbar{margin-top:10px;gap:4px}
.onepage .fb-scale{display:none}
.onepage .bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.onepage .bars .fanbar{margin-top:10px}
.onepage .abil{margin-top:12px}
.onepage .ab-cell{padding:6px 2px}
.onepage .ab-v{font-size:20px}
.onepage .dicecol .d20{max-width:104px}
.onepage .dicecol .die{max-width:96px}
.onepage .verdict{font-size:20px}
.onepage .install{display:none}
html.onepage,body.onepage{margin:0;height:100%;overflow:hidden;box-sizing:border-box}
.onepage .rating>.lbl:last-child{display:none}
.onepage .who .pos .lbl{font-size:10.5px}
.onepage .stage .lbl{font-size:10px}
.onepage .stage .evbox{padding:7px 10px;gap:3px}
.onepage .stage .evbox,.onepage .stage .evdesc{font-size:12.5px;line-height:1.4}
.onepage .stage .sum{font-size:13px}
.onepage .stage .verdict{font-size:18px}
.onepage .stage .muted.small,.onepage .stage .small{font-size:12px}
.onepage .stage .banner{font-size:13px;padding:6px 10px}
.top{flex-wrap:nowrap;padding-bottom:0}
.top .meta{flex-wrap:nowrap;gap:6px}
.top .meta>.lbl,.top [data-act="reset"],.theme-btn .tl{display:none}
.mark{font-size:20px}
.tabs button{padding-block:6px}
@media (max-width:440px){.tabs{gap:0}.tabs button{padding-inline:6px;font-size:13px}.tabs .tab-home{padding-inline:4px 8px}.tablogo{width:24px;height:24px}}
.onepage .who{flex-wrap:nowrap;gap:10px}
.onepage .who>.stack{gap:3px!important;min-width:0}
.onepage .who .muted{font-size:14px}
.onepage .rating .big{font-size:26px}
.onepage .bars .fanbar{margin-top:8px}
.onepage .abil{grid-template-columns:repeat(8,1fr)!important;margin-top:10px}
.onepage .lfull,.onepage .lshort{display:none!important} .onepage .l3{display:inline}
.onepage .ab-cell{padding:5px 1px}
.onepage .ab-v{font-size:18px}
.onepage .ab-m{font-size:10px}
.onepage .wrap>.panel.hero{padding:12px 14px}
.onepage .stage:not(.v){grid-template-columns:96px minmax(0,1fr)!important;gap:14px}

.onepage .stage h3{font-size:19px}
.onepage .stage .dicecol{gap:6px}
.onepage .stage .dicecol .small{max-width:34px}
.onepage .stage .dcell .lbl{font-size:9px}
.onepage .stage .stack{gap:7px!important}
.onepage .stage .evdesc,.onepage .stage .evbox{font-size:13.5px}
.onepage .stage .chip{font-size:11.5px;padding:2px 7px}
.onepage .stage .btn{padding:9px 14px;font-size:14px}
.onepage .stage .row{flex-wrap:nowrap;align-items:center}
.tl-s{display:none} .onepage .tl-l{display:none} .onepage .tl-s{display:inline}
.onepage .stage [data-act="simrest"]{display:none}
.onepage .stage .row .btn:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onepage .stage .btn.ghost.sm{flex:none;padding:8px 10px;font-size:12.5px}
.tabs .tab-home{display:inline-flex;align-items:center;justify-content:center;padding-inline:10px}
.tablogo{width:26px;height:26px;display:block}
.tab-home[aria-selected="true"] .tablogo{color:var(--accent)}
.teambar .fb-fill{background:var(--ink-3)} .teambar .fb-state{color:var(--ink-2)}
.teambar.tl0 .fb-fill,.teambar.tl1 .fb-fill{background:var(--accent)} .teambar.tl0 .fb-state,.teambar.tl1 .fb-state{color:var(--accent)}
.fl0 .fb-fill{background:var(--bad)} .fl0 .fb-state{color:var(--bad)}
.fl1 .fb-fill{background:var(--warn)} .fl1 .fb-state{color:var(--warn)}
.fl2 .fb-fill{background:var(--ink-3)} .fl2 .fb-state{color:var(--ink-2)}
.fl3 .fb-fill,.fl4 .fb-fill{background:var(--good)} .fl3 .fb-state,.fl4 .fb-state{color:var(--good)}
.fl5 .fb-fill{background:var(--accent)} .fl5 .fb-state{color:var(--accent)}
.fl6 .fb-fill{background:linear-gradient(90deg,var(--good),var(--accent))} .fl6 .fb-state{color:var(--accent)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.chip.fit{color:var(--good);border-color:transparent;background:var(--good-soft)}
.chip.inj{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.chip.yel{color:var(--accent);border-color:transparent;background:var(--accent-soft);font-weight:600}
.chip.gold{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.chip.hot{color:var(--bad);border-color:var(--bad);font-weight:600}
/* dice */
.dice{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:620px){.dice{grid-template-columns:repeat(4,1fr)}}
.dcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.die{width:100%;max-width:72px;height:auto;display:block;overflow:visible;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
.die .face{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;transition:fill .3s,stroke .3s}
.die .edge{stroke:var(--dedge);stroke-width:1;fill:none}
.d20 .face{fill:var(--d20);stroke:var(--d20)} .d20 .edge{stroke:rgba(255,255,255,.35)} .d20 text{fill:var(--dnum)}
.d10 .face,.dN .face{fill:var(--d10)} .d10 text,.dN text{fill:var(--d10num)}
.die.evd .face{fill:var(--warn-soft);stroke:var(--warn)} .die.evd text{fill:var(--warn)}
.die text{font-family:var(--f-num);font-weight:500;text-anchor:middle;dominant-baseline:central}
.die.crit .face{fill:#e2a93b;stroke:#c98f22} .die.crit text{fill:#1a1405} .die.crit .edge{stroke:rgba(255,255,255,.35)}
.die.fumble .face{fill:#8f1d1d;stroke:#8f1d1d} .die.fumble text{fill:#fff} .die.fumble .edge{stroke:rgba(255,255,255,.35)}
.die.win .face{fill:var(--good);stroke:var(--good)} .die.win text{fill:#fff} .die.win .edge{stroke:rgba(255,255,255,.35)}
.die.lose .face{fill:var(--bad);stroke:var(--bad)} .die.lose text{fill:#fff} .die.lose .edge{stroke:rgba(255,255,255,.35)}
.die.mid .face{fill:var(--warn);stroke:var(--warn)} .die.mid text{fill:#fff} .die.mid .edge{stroke:rgba(255,255,255,.35)}
.die.dropped{opacity:.25}
.d20 .edge{stroke:rgba(128,128,128,.5)}
.die.evd .face{fill:var(--d20);stroke:var(--d20)} .die.evd text{fill:var(--dnum)}
.dbtn{background:none;border:1px solid transparent;padding:8px 2px;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px;width:100%}
.dbtn:not(:disabled):hover{border-color:var(--rule)}
.dbtn:disabled{cursor:default}
.dbtn .lbl{font-size:10px;letter-spacing:.04em}
.hint{font-size:11px;color:var(--ink-3);min-height:1.2em}
.dicecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.dicecol .die{max-width:110px}
.dicecol .d20{max-width:130px}
.dicecol .small{max-width:52px}
.pair{display:flex;gap:8px;justify-content:center}
.pair .die{max-width:80px}
/* buttons */
button{font:inherit;cursor:pointer}
.btn{font-weight:600;font-size:15px;padding:10px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{font-size:13px;padding:6px 11px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--rule-2);border-radius:8px;padding:8px 11px}
input[type=text]{flex:1 1 200px;min-width:0;max-width:340px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:end}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .btn{white-space:nowrap}
/* match card */
.stage{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:520px){.stage{grid-template-columns:1fr;justify-items:center;text-align:center}.stage .mods,.stage .row{justify-content:center}.evbox{text-align:left}}
.stage h3{font-size:22px}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.sum{font-family:var(--f-num);font-size:14px}
.sum b{color:var(--accent);font-weight:600}
.verdict{font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.v-good{color:var(--good)} .v-bad{color:var(--bad)} .v-mid{color:var(--warn)}

.cabinet.oneline{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;flex:none}

.cabinet.oneline>*{flex:none;white-space:nowrap}
.offnotes{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.35}

/* create */

.cfields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;flex:none}

/* career tab */

.cgrid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;flex:none}

/* fit fixes */

@media (max-height:720px){.onepage .stage h3{font-size:17px}.onepage .stage .evdesc{font-size:12.5px;line-height:1.35}.onepage .st-head .banner{font-size:11.5px;padding:3px 8px}}

 rules:[['Início','Você começa no seu país. Sul-americanos vão direto para a primeira divisão, a não ser que os dados sejam muito ruins. Nas grandes ligas europeias a primeira divisão pede média alta, então a maioria começa na segunda.'],
  ['Temporada','A liga é jogada em quatro fases no d20, com a copa nacional a partir das oitavas e, se classificado, o torneio continental no meio. O título pede uma sequência de fases fortes; 4 derrotas pesadas podem rebaixar qualquer clube. O G4 garante vaga no torneio continental.'],
  ['Momentos','Antes de alguns jogos surge um momento: pênalti, falta, carrinho e mais. Role aquele dado mais o atributo ÷ 5. Se der certo, o jogo ganha vantagem ou bônus; se der errado, pode vir desvantagem.'],
  ['Vantagem','Role dois d20 e fique com o maior. Desvantagem fica com o menor.'],
  ['Cada d20','d20 + mod do jogador + mod do clube + o atributo foco do técnico ÷ 5, contra uma CD.'],
  ['Acesso','Termine entre os 4 primeiros na segunda divisão e seu clube sobe. Clubes pequenos que terminam entre os 3 últimos caem.'],
  ['Copas continentais','Depois da primeira temporada, sua própria campanha decide, seja qual for o clube (um clube grande no início já começa no torneio continental): G4 vale Champions League ou Libertadores, do 5º ao 8º vale Europa League ou Sul-Americana. Ganhar a copa nacional ou uma copa continental também garante vaga no torneio principal.'],
  ['1 natural','Lesão. Role d10 para se recuperar: 9–10 tudo bem, 5–8 fora por 1 jogo, 2–4 fora por 2, 1 fora por 3 e −1 de Velocidade.'],
  ['20 natural','Vence qualquer mata-mata, e o atributo foco ganha +1 no fim da temporada.'],
  ['Evolução','+1 em tudo por ano até os 22, depois +3 espalhados até os 27. Média alta no d20 dá pontos bônus, e uma fase iluminada (média 13+) segura o declínio. Toda evolução para depois dos 33.'],
  ['Aposentadoria','A partir do verão depois da temporada aos 32, role d20 + um bônus de Físico para continuar jogando (de −3 com Físico 4 até +5 com 20). Fica mais difícil a cada ano. Quem chega aos 40 se aposenta como lenda da longevidade. A partir dos 32 você também pode se aposentar quando quiser.'],
  ['Transferências','Seu nível, títulos e fase decidem quem liga. Os maiores clubes do mundo pedem nível bem acima de 17.'],
  ['Copa do Mundo','A cada 4 anos (2030, 2034…), no meio da temporada. Você é convocado se seu nível for alto o bastante para a sua seleção; as favoritas são as mais difíceis de entrar. Três jogos no grupo: vença um e perca no máximo um para chegar ao mata-mata.'],
  ['Posição','Seus dados decidem. Centroavantes fazem mais gols, pontas e meias dão mais assistências, e os momentos puxam para os atributos da sua posição.']],

  if(fx.mode==='dis')return `<span class="fx down">${t.fx.dis}</span>`;
  if(fx.buff)return `<span class="fx ${fx.buff>0?'up':'down'}">${t.fx.buff(fx.buff)}</span>`;
  return `<span class="fx flat">${t.fx.none}</span>`;
}

let achMem=null;
function loadAch(){if(achMem)return{...achMem};try{achMem=JSON.parse(localStorage.getItem(ACHKEY)||'{}')||{}}catch(e){achMem={}}return{...achMem}}
function saveAch(a){achMem={...a};try{localStorage.setItem(ACHKEY,JSON.stringify(a))}catch(e){}if(window.cloudSync)cloudSync()}
function checkAch(silent){
  if(!S||S.phase==='create')return;
  if(S.club&&fanTier()===0)S.hatedAt=S.club.name;
  if(S.club&&S.phase!=='create'){S.clubPeak=S.clubPeak||{};S.clubPeak[S.club.name]=Math.max(S.clubPeak[S.club.name]||0,fanTier())}
  const got=loadAch(), newly=[];
  ACH.forEach(a=>{if(got[a.id])return;let ok=false;try{ok=a.test()}catch(e){}if(ok){got[a.id]=Date.now();newly.push(a)}});
  if(!newly.length)return;
  saveAch(got); if(view==='ach')render();
  if(!silent)newly.forEach(a=>toastQ.push(a));
  showToast();
}

let toastQ=[], toastEl=null;
function showToast(){
  if(toastEl||!toastQ.length||typeof document==='undefined'||!document.body)return;
  const a=toastQ.shift(), L=lang==='pt'?1:0, more=toastQ.length;
  toastEl=document.createElement('div'); toastEl.className='toast'+(a.bad?' bad':''); toastEl.setAttribute('role','status');
  toastEl.innerHTML=`${achIcon(a,true)}<div class="toast-t"><span class="lbl">${a.bad?t.achBadT:t.achT}${more?` · +${more}`:''}</span><b>${a.n[L]}</b><span>${a.d[L]}</span></div>`;
  document.body.appendChild(toastEl); sfx(a.bad?'achBad':'ach');
  const el=toastEl, hide=()=>{if(toastEl!==el)return;el.classList.add('out');setTimeout(()=>{el.remove();toastEl=null;showToast()},reduce?0:260)};
  el.addEventListener('click',hide); setTimeout(hide,3800);
}

function compStatus(comp){
  const s=S.season, st=s.stages.filter(x=>x.comp===comp); if(!st.length)return null;
  const done=st.filter(x=>x.res&&!x.res.skipped), out=st.some(x=>x.res&&x.res.skipped)||done.some(x=>x.res.win===false&&!x.res.wdl);
  const champ=done.some(x=>x.res.champ), next=st.find(x=>!x.res);
  let txt,tone='m';
  if(champ){txt=t.won;tone='w'}
  else if(out){const lost=done.filter(x=>x.res.win===false||x.res.wdl==='L').pop()||done[done.length-1];txt=t.outIn(lost?roundName(lost):roundName(st[0]));tone='l'}
  else if(next){txt=done.length?t.stillIn(roundName(next)):t.startsIn(roundName(next));tone=done.length?'w':'m'}
  else txt='—';
  return{name:compName(comp,S.club.league),txt,tone};
}

/* ---------- Hall of Fame tags: how the career went ---------- */
const BLESS=11.6, CURSE=9.6;
function careerTags(){
  const H=S.history, out=[], rs=S.rs||{n:0,sum:0,n20:0,n1:0}, avg=rs.n?rs.sum/rs.n:10, fin=S.fin||{w:0,l:0};
  const clubs=[...new Set(H.map(h=>h.club))], inj=H.reduce((a,h)=>a+(h.injuries||0),0);
  const goals=H.reduce((a,h)=>a+h.goals,0), assists=H.reduce((a,h)=>a+h.assists,0);
  const peakAt=H.reduce((b,h)=>h.rating>b.rating?h:b,H[0]);
  Object.entries(S.clubPeak||{}).forEach(([c,lv])=>{if((S.legends||[]).some(l=>l.club===c))out.push(['legend',c]);else if(lv>=5&&H.filter(h=>h.club===c).length>=8&&H.filter(h=>h.club===c).reduce((a,h)=>a+h.trophies.filter(x=>x.kind!=='bdo').length,0)>=3)out.push(['idol',c])});
  (S.legends||[]).forEach(l=>{if(!out.some(x=>x[0]==='legend'&&x[1]===l.club))out.push(['legend',l.club])});
  if(rs.n>=50&&avg>=BLESS)out.push(['blessed']); else if(rs.n>=50&&avg<=CURSE)out.push(['cursed']);
  if(rs.n20>=12)out.push(['nat20s']);
  if(fin.w>=5&&fin.w>=fin.l*2)out.push(['biggame']); else if(fin.l>=4&&fin.l>fin.w)out.push(['bottler']);
  if(clubs.length>=8)out.push(['journeyman']);
  if(H.length>=10&&inj===0)out.push(['iron']); else if(inj>=12)out.push(['glass']);
  const at25=H.find(h=>h.age===25);if(at25&&at25.rating<12&&peakAt.rating>=15)out.push(['late']); else if(H.some(h=>h.age<=21&&h.rating>=12.5))out.push(['prodigy']);
  if(H.length>=8&&goals/H.length>=20)out.push(['scorer']); else if(assists>=150&&assists>goals*1.5)out.push(['creator']);
  if((S.hatedAt&&(S.clubPeak||{})[S.hatedAt]>=4))out.push(['redemption']);
  return out;
}

let actx=null, master=null;
function ac(){

      master=actx.createGain();master.gain.value=.16;master.connect(lp);lp.connect(comp);comp.connect(actx.destination)}

    return actx;
  }catch(e){return null}
}
function tone(f,t0,dur,o={}){

  os.connect(g); g.connect(master); os.start(t0); os.stop(t0+dur+.03);
}

/* a rounded bell: a sine, a quiet octave that fades first, slow-ish attack */
function bell(f,t0,dur,vol){tone(f,t0,dur,{vol,a:.018});tone(f*2,t0,dur*.45,{vol:vol*.18,a:.018});tone(f*3.01,t0,dur*.2,{vol:vol*.05,a:.01})}

  // a few muffled taps, like a die settling on felt
  roll(ms){let t=actx.currentTime;const n=Math.max(5,Math.round(ms/140));for(let k=0;k<n;k++){const p=k/n;tick(t,.17*(1-p*.55));t+=.05+.17*p*p}},
  // two soft rising bells

  nat20(){const t=actx.currentTime;[523.25,659.25,784,1046.5,1318.5].forEach((f,k)=>bell(f,t+k*.075,.9,.04))},

  nat1(){const t=actx.currentTime;tone(261.6,t,.4,{vol:.09,a:.03});tone(196,t+.22,.65,{vol:.09,f2:185,a:.035});tone(98,t+.22,.5,{vol:.04,a:.04})},

function rollDice(els,sides,finals,clsFn,done){

  if(reduce){els.forEach((el,i)=>{setFace(el,finals[i]);const c=clsFn(finals[i]);if(c)el.classList.add(c)});setTimeout(done,150);return}

    const delay=i*70, dir=i%2?1:-1;

    let cur=d(sides); setFace(el,cur);                       // numbers from the very first frame
    el.animate([
      {transform:'translateY(0) rotate(0deg) scale(1)'},
      {transform:`translateY(-9%) rotate(${dir*420}deg) scale(.92)`,offset:.45},
      {transform:`translateY(0) rotate(${dir*700}deg) scale(1.03)`,offset:.85},
      {transform:`translateY(0) rotate(${dir*720}deg) scale(1)`}

/* legacy: each position's output counts the same in the Hall of Fame */
const OUTF={ST:.95,W:1.4,AM:1.45,CM:1.6,DM:1.4,FB:1.35,CB:1.15};

/* extra match modifiers from feats, items, companions and form */
function extraMods(st){
  const s=S.season, o=[]; if(!st||!S.club)return o;
  if(hasFeat('clutch')&&isFinal(st))o.push(['fClutch',2]);
  if(hasFeat('bigstage')&&['cont','cont2','cwc','wc'].includes(st.comp))o.push(['fBig',1]);
  if(hasFeat('workhorse')&&st.comp==='league')o.push(['fWork',1]);
  if(hasFeat('wall')&&(st.key==='def'||st.key==='str'))o.push(['fWall',1]);
  if(hasItem('boots')&&isFinal(st))o.push(['iBoots',1]);
  if(st.comp==='league'&&clubItem('armband',S.club.name))o.push(['iArm',1]);
  if(st.comp==='cup'&&clubItem('shirt',S.club.name))o.push(['iShirt',1]);
  if(st.comp==='wc'&&hasItem('ball'))o.push(['iBall',1]);
  const m=mateNow(); if(m&&m.bond>=4&&st.comp==='league')o.push(['mate',1]);
  if(s&&s.bench>0&&st.comp==='league')o.push(['bench',-2]);
  return o;
}
const extraSum=st=>extraMods(st).reduce((a,x)=>a+x[1],0);
function effMode(st){
  let m=(st.fx||{}).mode||null;
  if(st.red)m=m==='adv'?null:'dis';
  if(st.comp==='run'&&S.season&&S.season.run&&S.season.run.type==='miracle')m=m==='adv'?null:'dis';
  if(st.insp)m=m==='dis'?null:'adv';

}
/* chance of a d20 roll reaching `need` (nat 1 always fails; a crit always wins when critWin) */
function chanceOf(need,mode,critWin){
  let p=0;for(let v=1;v<=20;v++){const ok=v===1?false:(critWin&&isCrit(v))?true:v>=need;if(ok)p++}
  p/=20; if(mode==='adv')return 1-(1-p)*(1-p); if(mode==='dis')return p*p; return p;
}
function stageOdds(st){
  const s=S.season, cm=teamMod(st), pm=pmod(rating(S.attrs)), kb=keyBonus(S.attrs[st.key]), fx=st.fx||{buff:0};
  const raw=pm+cm+kb+(fx.buff||0)+(st.comp==='wc'?0:loyBonus())+extraSum(st), mods=capMods(raw)+(s.hot>0?2:0), dc=dcFor(st), mode=effMode(st);
  if(st.comp==='league'){const need=dc+3-mods;return{need,p:chanceOf(need,mode,false),league:1}}
  const need=dc-mods;return{need,p:chanceOf(need,mode,true)};
}

 contract:{opts:[{k:'extend',fx:{loy:2}},{k:'raise',at:'lead',tgt:13,ok:{insp:1,buff:1},bad:{loy:-2}}]}
};

/* ---- nemesis: one rival who keeps crossing your path ---- */
function nemNats(){return Object.keys(NATIONS).filter(n=>n!==S.nat&&(S.gender!=='f'||NATIONS[n].firstW))}
function makeNemesis(derby){
  let nat=pick(nemNats());

  if(derby&&riv.length){const c=pick(riv);S.nem.club=c;S.nem.league=info[c].league}
  else if(derby){const l=leagueClubs(S.club.league).filter(n=>n!==S.club.name).sort((a,b)=>teamStr(b)-teamStr(a)).slice(0,4);if(l.length){S.nem.club=pick(l);S.nem.league=S.club.league}}

  {const c=S.nem.league!=null&&LEAGUES[S.nem.league]?LEAGUES[S.nem.league].c:null, ok=n=>!!NATIONS[n]&&(S.gender!=='f'||!!NATIONS[n].firstW);nat=ok(c)?c:S.nat;S.nem.nat=nat;S.nem.name=randomName(nat,S.gender)}

/* ---- season quests ---- */
function makeQuest(){
  const P=POS[myPos()], L=LEAGUES[S.club.league], r=clubRank(S.club.name,S.club.league), games=L.matches+10;
  const expG=games*(S.attrs.fin/20)*0.45*P.g, expA=games*((S.attrs.pas+S.attrs.ski)/40)*0.35*P.a, expCS=games*csW()*0.38*(S.attrs.def/20+.3);
  const o=[];
  if(P.g>=.7)o.push({k:'goals',n:Math.max(5,Math.round(expG*1.05))});
  if(P.a>=.8)o.push({k:'assists',n:Math.max(4,Math.round(expA*1.05))});
  if(csW()>=.7)o.push({k:'cs',n:Math.max(5,Math.round(expCS*1.05))});
  o.push(L.div===2?{k:'promo'}:r.frac<=.12?{k:'title'}:r.frac<=.4?{k:'top4'}:{k:'half'});

function questProg(q,s,h){

}
function questReward(q){

function afterSeason(h,s){

}

  if(k.startsWith('tr:')){const x=k.slice(3);h.campGot=[];for(let i=0;i<2;i++)if(S.attrs[x]<20&&rating(S.attrs)<potCap()+1){S.attrs[x]++;h.campGot.push(x)}}

/* ---- the agent works the phones ---- */
const agentBonus=()=>Math.floor((S.attrs.lead-10)/2)+(fanTier()>=4?1:0);
function agentOffer(boost){
  const h=S.history[S.history.length-1], eff=rating(S.attrs)+boost, cur=clubAfterMove(h), have=new Set((S.offers||[]).map(o=>o.name).concat(S.club.name));
  const best=(S.offers||[]).reduce((a,o)=>Math.max(a,o.pr!=null?o.pr:tierOf(o.league,o.tier).pr),tierOf(cur.league,cur.tier).pr);
  const c=[];LEAGUES.forEach((L,Li)=>L.tiers.forEach((tr,ti)=>{if(gOK(L)&&!L.exotic&&eff>=tr.min&&tr.pr>=best-(boost>1?0:1))tr.clubs.forEach(n=>{if(!have.has(n))c.push({name:n,league:Li,tier:ti,pr:tr.pr})})}));
  if(!c.length)return null; c.sort((a,b)=>b.pr-a.pr);
  const top=c.filter(o=>o.pr>=c[0].pr-(boost>1?0.1:1)); const o=pick(top); return{...o,agent:1};
}
function askAgent(v){
  const h=S.history[S.history.length-1]; if(!h||h.agent)return;
  const b=agentBonus(), tot=v+b; let res;
  if(v===20||tot>=18){const o=agentOffer(2);res=o?'great':'none';if(o)S.offers=(S.offers||[]).concat(o)}
  else if(v!==1&&tot>=12){const o=agentOffer(.5);res=o?'ok':'none';if(o)S.offers=(S.offers||[]).concat(o)}
  else if(v===1){res='disaster';if((S.offers||[]).length)S.offers=S.offers.slice(0,-1);addLoy(-1)}

}

/* ---- chronicle: one line per season, written from what happened ---- */
function chron(h){
  const C=t.chron, L=LEAGUES[h.league], bits=[];
  if(h.pos===1&&L.div===1)bits.push(C.champ(L.name));
  else if(h.move==='up')bits.push(C.up);
  else if(h.move==='down')bits.push(C.down);
  const cups=h.trophies.filter(x=>x.kind!=='league'&&x.kind!=='bdo').map(trophyName);
  if(cups.length)bits.push(C.won(cups.join(', ')));
  if(h.bdo===1)bits.push(C.bdo);
  if(h.wc===5)bits.push(C.wc);
  const lead=bits.length?bits.join(C.and):C.pos(ord(h.pos),L.name);
  const me=csW()>=.7&&h.cs?C.cs(h.cs):h.goals>=h.assists?C.goals(h.goals):C.assists(h.assists);
  const extra=[];
  if(h.nemW||h.nemL)extra.push(h.nemW>=h.nemL?C.nemWin(esc(S.nem?S.nem.name:'')):C.nemLose(esc(S.nem?S.nem.name:'')));
  if(h.fired)extra.push(C.fired);
  if(h.injuries>=2)extra.push(C.inj);
  if(h.quest&&h.quest.done)extra.push(C.quest);
  if(h.feat)extra.push(C.feat(t.feats[h.feat][0]));
  return `${h.year} · ${esc(h.club)}: ${lead}; ${me}.${extra.length?' '+extra.join(' '):''}`;
}

/* ---- daily career: a seeded roll that everyone gets today ---- */
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const todayStr=()=>{const d0=new Date();return `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`};
function startDaily(){
  const ds=todayStr(), seed=+ds.replace(/-/g,'')*7+(S.gender==='f'?3:1), orig=Math.random;
  Math.random=seeded(seed);
  try{
    const g=S.gender; S=fresh(g);
    const nats=Object.keys(NATIONS).filter(n=>g!=='f'||NATIONS[n].firstW);
    S.nat=pick(nats); S.name=randomName(S.nat,g); S.roll=Object.fromEntries(AK.map(k=>[k,d(10)])); S.rerolls=0; S.pot=d(10); S.daily=ds;
    S.startOffers=makeStartOffers(rating(S.roll),S.nat);
  }finally{Math.random=orig}
}

/* ---- simulate up to the next thing that needs you ---- */
const isStop=st=>!!st&&((st.ch&&!st.chr)||isFinal(st)||!!st.nem);
function simNext(){
  let g=0;
  while(S.phase==='season'&&g++<300){
    const s=S.season, st=s.stages[s.idx];
    if(s.careerOver||s.pickAttr||s.pendingHeal)break;
    if(s.last){nextStage();const n=S.season&&S.season.stages[S.season.idx];if(S.phase!=='season'||isStop(n)||(n&&n.ev&&!n.evr&&false))break;continue}
    if(st.ch&&!st.chr)break;
    if(st.ev&&!st.evr){resolveEvent(d(EVMAP[st.ev].die));continue}
    resolveStage(d(20),d(20));
  }
}

/* ---- rating over the years, with title seasons marked ---- */

  const X=i=>(6+i*(W-12)/(H.length-1)).toFixed(1), Y=v=>(Hh-6-(v-min)/(max-min)*(Hh-14)).toFixed(1);
  const pts=H.map((h,i)=>`${X(i)},${Y(h.rating)}`).join(' ');

/* ================= v44: run-in, pop-ups, career radar ================= */
/* ---- the final three games when the title, survival or promotion is on the line ---- */
function projPos(s){
  const L=LEAGUES[S.club.league], cr=clubRank(S.club.name,S.club.league), e=1+cr.frac*(L.size-1);
  if(s.noise==null)s.noise=(Math.random()+Math.random()-1)*2.8-(Math.random()<.05?4:0);
  let p=clamp(Math.round(e-(s.leagueSum/2.5)*.5+s.noise),1,L.size);
  const lg=s.stages.filter(x=>x.comp==='league'&&x.res&&!x.res.skipped), goods=lg.filter(x=>x.res.kind<=1).length;
  if(p===1&&goods<3)p=2; return p;
}
function runCheck(){
  const s=S.season; if(!s||s.runChecked||(s.v||4)<5)return;
  const lg=s.stages.filter(x=>x.comp==='league'); if(!lg.length||lg.some(x=>!x.res))return;
  s.runChecked=1;
  if(s.seasonOut)return;
  const L=LEAGUES[S.club.league], pr=projPos(s), size=L.size, fails=lg.filter(x=>x.res&&!x.res.skipped&&x.res.kind===4).length;
  let type=null;
  const goods=lg.filter(x=>x.res&&!x.res.skipped&&x.res.kind<=1).length;
  if(L.div===1&&(pr===1||(pr===2&&goods>=2)))type='title';
  else if(L.div===1&&(pr===2||(pr===3&&goods>=2)))type='miracle';
  else if(L.div===2){const up=size<=12?2:4;if(pr>=up-1&&pr<=up+2)type='promo'}
  if(!type&&L.div===1&&L.down!=null){
    const shieldFree=S.club.tier>=2&&!(S.shield||{})[S.club.name];
    if((fails>=4&&!shieldFree)||(S.club.tier===0&&fails>=3&&pr>=size-2)||(fails>=3&&pr>=size-2))type='releg';
  }
  if(!type)return;
  s.run={type,pr};
  const at=s.stages.findIndex(x=>!x.res), idx=at<0?s.stages.length:at;
  s.stages.splice(idx,0,...[0,1,2].map(g=>({comp:'run',round:0,g,key:focusKey(),res:null})));
}
const runPts=s=>s.stages.filter(x=>x.comp==='run'&&x.res&&x.res.wdl).reduce((a,x)=>a+(x.res.wdl==='W'?3:x.res.wdl==='D'?1:0),0);
const runNeed=s=>!s.run?0:s.run.type==='title'?(s.run.pr===1?4:9):s.run.type==='miracle'?9:s.run.type==='releg'?4:5;
function runDC(){const s=S.season,L=LEAGUES[S.club.league];return L.dc+(s.run&&s.run.type==='title'?2:s.run&&s.run.type==='miracle'?4:0)}

/* ---- pop-up queue for the off-season and the story moments ---- */
let ovKind=null;
const ovHas=k=>ovKind===k||ovQ.some(o=>o.k===k);
function maybePrep(){
  if(view!=='game'||S.phase!=='offseason')return;
  const h=S.history[S.history.length-1]; if(!h)return;
  if(['agechk','feat','camp','window'].some(ovHas))return;
  if(ageCheckDue(h)){ovQ.push({k:'agechk'});return}
  if(h.ageCheck&&!h.ageCheck.ok)return;
  if(h.featDue&&!h.feat){ovQ.push({k:'feat'});return}
  if(!h.camp&&S.age<40){ovQ.push({k:'camp'});return}
}
function maybePick(){
  if(view!=='game'||S.phase!=='season'||!S.season||!S.season.pickAttr||ovHas('pick'))return;
  ovQ.push({k:'pick'});
}
function pickHTML(){
  return `<div class="ovcard move prepop"><span class="ov-kicker">${t.natural20}</span><h2 class="ov-title" style="font-size:24px">${t.pickT}</h2><div class="ov-sub2">${t.critPick}</div>
    <div class="picks pop">${AK.map(k=>`<button class="pickbtn" data-ov="pick" data-k="${k}" ${S.attrs[k]>=20?'disabled':''}><span class="lbl">${t.attrsS[k]}</span><b class="num">${S.attrs[k]}→${Math.min(20,S.attrs[k]+1)}</b></button>`).join('')}</div></div>`;
}
function maybeRun(){
  if(view!=='game'||S.phase!=='season'||!S.season)return;
  const s=S.season, st=s.stages[s.idx];
  if(!st||st.comp!=='run'||s.pendingHeal||s.pickAttr||s.out>0||ovHas('run'))return;
  if(s.last&&s.last.stage!==s.idx)return;
  if(s.last&&!s.stages.some(x=>x.comp==='run'&&!x.res))return;
  ovQ.push({k:'run'});
}
let runRes=null;
function runFinish(){
  if(ovKind!=='run'||!S.season)return;
  const s=S.season, L=LEAGUES[S.club.league], type=s.run&&s.run.type, lg=S.club.league, pts=runPts(s), need=runNeed(s);
  nextStage();
  ovQ=ovQ.filter(o=>o.k!=='league');
  const F=s.fin||{}, pos=F.pos;
  runRes={type,pos,pts,need,lg,ok:!!(s.run&&s.run.ok),move:F.move,champ:pos===1};
  save(); ovUpdate(runResultHTML());
  if(runRes.champ){confetti(ovEl,{k:'league'});sfx('title')}else sfx(runRes.ok?'pass':'fail');
}
function runResultHTML(){
  const R=runRes, L=LEAGUES[R.lg];
  let title, tone;
  if(R.champ){title=t.ovLeague;tone='good'}
  else if(R.type==='releg'){title=R.move==='down'?t.runRelegated:t.runEscaped;tone=R.move==='down'?'bad':'good'}
  else if(R.type==='promo'){title=R.move==='up'?t.runPromoted:t.finished(R.pos);tone=R.move==='up'?'good':'bad'}
  else{title=t.finished(R.pos);tone='mid'}
  return `<div class="ovcard move runpop runres ${tone}">${R.champ?trophySVG():''}<span class="ov-kicker">${t.runT} · ${esc(L.name)}</span><h2 class="ov-title">${title}</h2><div class="ov-sub">${esc(S.club.name)}</div><div class="ov-sub2">${t.runPts(R.pts,R.need)}</div><button class="btn" data-ov="rdone">${t.runCont}</button></div>`;
}
function runHTML(){
  if(runRes)return runResultHTML();
  const s=S.season, st=s.stages[s.idx]; if(!st||st.comp!=='run')return'';
  const r=s.last&&s.last.stage===s.idx?s.last:null, need=runNeed(s), pts=runPts(s), md=r?(r.pair?r.mode:null):effMode(st);
  const games=s.stages.filter(x=>x.comp==='run').map(x=>`<span class="wd ${x.res&&x.res.wdl||''}">${x.res&&x.res.wdl?t.wdlS[x.res.wdl]:x.g+1}</span>`).join('');
  const vals=r?(r.pair||[r.nat]):[];
  const kept=r&&r.pair?(md==='adv'?(r.pair[0]>=r.pair[1]?0:1):(r.pair[0]<=r.pair[1]?0:1)):0;
  const outc=v=>!r?'':v===20?'crit':v===1?'fumble':r.tone==='good'?'win':r.tone==='bad'?'lose':'mid';
  const dice=md?`<div class="pair">${[0,1].map(i=>dieSVG(20,vals[i]??'',(r?outc(vals[i]):'')+(r&&i!==kept?' dropped':''),'rd'+i)).join('')}</div>`:dieSVG(20,r?r.nat:'',r?outc(r.nat):'','rd0');
  let body='';
  if(!r){const od=stageOdds(st);body=`<div class="mods" style="justify-content:center"><span class="chip">${t.dc} ${dcFor(st)}</span><span class="chip odds">${t.odds(od.need,Math.round(chanceOf(od.need,md,true)*100))}</span>${st.red?`<span class="chip inj">${t.redChip}</span>`:''}</div>`}
  else body=`<div class="sum num">d20 <b>${r.nat}</b> ${sg(r.mods)}${r.hot?` ${sg(r.hot)}`:''} = <b>${r.total}</b> ${t.vs} ${t.dc} ${r.dc} <span class="lbl">(${t.drawAt(r.dc-3)})</span></div><div class="verdict result v-${r.tone}" style="font-size:22px">${t.wdl[r.wdl]}</div>${r.ct?`<div class="small ctline ${r.ct.good?'up':'down'}">${t.critD6(r.ct.v)} · ${r.ct.good?t.ctG[r.ct.v]:r.ct.v<=3?t.nat1:t.ctB[r.ct.v]}</div>`:''}`;
  const left=s.stages.filter(x=>x.comp==='run'&&!x.res).length;
  const btn=!r?`<button class="btn" data-ov="rroll">${md==='adv'?t.rollAdv:md==='dis'?t.rollDis:t.roll(20)}</button>`
    :s.pendingHeal||s.pickAttr?`<button class="btn" data-ov="rclose">${t.storyBack}</button>`
    :left?`<button class="btn" data-ov="rnext">${t.runNext}</button>`:`<button class="btn ghost" data-ov="rtable" style="opacity:.6">${t.runTable}</button>`;
  const insp=!r&&((S.insp||0)>0||st.insp)?`<button class="tool insp" data-ov="rinsp" aria-pressed="${!!st.insp}">${t.inspBtn(S.insp||0)}</button>`:'';
  return `<div class="ovcard move runpop ${s.run.type}"><span class="ov-kicker">${t.runT} · ${esc(LEAGUES[S.club.league].name)}</span><h2 class="ov-title" style="font-size:24px">${t.runGame(st.g+1)}</h2>
    <div class="vsline">${crest(kitOf(S.club.name),20)}<b>${esc(S.club.name)}</b><span class="muted">${t.vs}</span>${crest(oppKit(st),20)}<b>${esc(oppName(st))}</b></div>
    <div class="ov-sub2">${t.runRule(s.run.type,need)}</div>
    <div class="grec" style="justify-content:center">${games}<span class="lbl">${t.runPts(pts,need)}</span></div>
    <div class="storydie runlie">${dice}</div>${insp}
    ${body}${btn}</div>`;
}
function runClick(e){
  const b=e.target.closest('[data-ov]'); if(!b||busy)return; const v=b.dataset.ov, s=S.season, st=s.stages[s.idx];
  if(v==='rinsp'){if(st.insp){st.insp=0;gainInsp(1)}else if((S.insp||0)>0){st.insp=1;S.insp--}save();ovUpdate(runHTML());return}
  if(v==='rroll'){const v1=d(20),v2=d(20),els=[ovEl.querySelector('[data-die="rd0"]'),ovEl.querySelector('[data-die="rd1"]')].filter(Boolean);
    rollDice(els,20,[v1,v2].slice(0,els.length||1),()=>'',()=>{resolveStage(v1,v2);sfxStage();save();ovUpdate(runHTML());
      const s2=S.season;if(!s2.stages.some(x=>x.comp==='run'&&!x.res)&&!s2.pendingHeal&&!s2.pickAttr&&!s2.careerOver){busy=true;setTimeout(()=>{busy=false;runFinish()},1500)}});return}
  if(v==='rdone'){runRes=null;closeOv();commit();return}
  if(v==='rnext'){nextStage();save();const n=S.season&&S.season.stages[S.season.idx];if(S.phase==='season'&&n&&n.comp==='run'){ovUpdate(runHTML())}else{closeOv();commit()}return}
  if(v==='rclose'){closeOv();commit();return}
  if(v==='rtable'){runFinish();return}
}
function maybeStory(){
  if(view!=='game'||S.phase!=='season'||!S.season)return;
  const s=S.season, st=s.stages[s.idx];
  if(!st||s.last||!st.ch||st.chr||s.out>0||ovHas('story'))return;
  ovQ.push({k:'story'});
}
function storyHTML(){
  const s=S.season, st=s.stages[s.idx]; if(!st||!st.ch)return'';
  const C=t.chx[st.ch], os=CHOICES[st.ch].opts, R=st.chr;
  const opts=os.map((o,i)=>{const at=o.at?chAt(o,st):null,b=at?chBonus(at):0;
    const line=o.at?`d20 ${sg(b)} ${t.attrs[at]} · ${t.target} ${o.tgt} · ${Math.round(chanceOf(o.tgt-b,null,true)*100)}%`:t.noRoll;
    const fx=o.at?`<span class="fx up">${t.onOk}: ${effText(o.ok)}</span><span class="fx down">${t.onBad}: ${effText(o.bad)}</span>`:`<span class="fx flat">${effText(o.fx)}</span>`;
    const pickd=R&&R.i===i;
    return `<button class="chopt ${pickd?'on':''}" data-ov="ch" data-i="${i}" ${R?'disabled':''}><b>${C[2][o.k]}</b><span class="lbl">${line}</span>${fx}</button>`}).join('');
  const o=R?os[R.i]:null;
  const res=R?`<div class="verdict result v-${R.ok?'good':'bad'}" style="font-size:20px">${R.auto?C[2][o.k]:R.ok?t.success:t.fail}</div><div class="small">${R.auto?'':`d20 ${R.nat} ${sg(R.bonus)} = ${R.total} ${t.vs} ${R.tgt} · `}${effText(R.auto?o.fx:R.ok?o.ok:o.bad)}</div>`:'';
  return `<div class="ovcard move story"><span class="ov-kicker">${t.storyT} · ${esc(compName(st.comp==='run'?'league':st.comp,S.club.league))}</span><h2 class="ov-title" style="font-size:24px">${C[0]}</h2><div class="ov-sub2">${C[1]}</div>
    <div class="storydie">${dieSVG(20,R&&!R.auto?R.nat:'',R&&!R.auto?(R.nat===20?'crit':R.nat===1?'fumble':R.ok?'win':'lose'):'evd','sd')}</div>
    ${R?res:`<div class="chopts">${opts}</div>`}
    ${R?`<button class="btn" data-ov="close">${t.storyBack}</button>`:''}</div>`;
}
function storyClick(e){
  const b=e.target.closest('[data-ov]'); if(!b||busy)return; const v=b.dataset.ov;
  if(v==='close'){closeOv();commit();return}
  if(v!=='ch')return;
  const s=S.season, st=s.stages[s.idx]; if(!st||!st.ch||st.chr)return;
  const i=+b.dataset.i, o=CHOICES[st.ch].opts[i]; if(!o)return;
  if(!o.at){resolveChoice(i,null);save();ovUpdate(storyHTML());return}
  ovEl.querySelectorAll('.chopt').forEach(x=>x.disabled=true);
  const x=d(20), el=ovEl.querySelector('[data-die="sd"]'), at=chAt(o,st);
  rollDice(el?[el]:[],20,[x],y=>y===20?'crit':y===1?'fumble':y+chBonus(at)>=o.tgt?'win':'lose',()=>{resolveChoice(i,x);sfx(x===20?'nat20':x===1?'nat1':st.chr.ok?'pass':'fail');save();ovUpdate(storyHTML())});
}
function ageHTML(){
  const h=S.history[S.history.length-1], ac=h.ageCheck;
  const btn=!ac?`<button class="btn" data-ov="roll">${t.roll(20)}</button>`:ac.ok?`<button class="btn" data-ov="close">${t.ageGo}</button>`:`<button class="btn danger" data-ov="hang">${t.ageHang}</button>`;
  return `<div class="ovcard move agepop ${ac?(ac.ok?'ok':'bad'):''}"><span class="ov-kicker">${t.ageT} · ${t.yrs(S.age)}</span><h2 class="ov-title" style="font-size:24px">${t.ageQ}</h2><div class="ov-sub2">${t.ageDesc(S.age)}</div>
    <div class="storydie">${dieSVG(20,ac?ac.nat:'',ac?(ac.nat===20?'crit':ac.nat===1?'fumble':ac.ok?'win':'lose'):'evd','ad')}</div>
    <div class="mods" style="justify-content:center"><span class="chip">d20 + ${t.attrs.str} ${sg(ageBonus())}</span><span class="chip">${t.dc} ${AGE_DC[S.age]}</span><span class="chip odds">${Math.round(chanceOf(AGE_DC[S.age]-ageBonus(),null,true)*100)}%</span></div>
    ${ac?`<div class="sum num">d20 <b>${ac.nat}</b> ${sg(ac.bonus)} = <b>${ac.nat+ac.bonus}</b> ${t.vs} ${t.dc} ${ac.dc}</div><div class="verdict result v-${ac.ok?'good':'bad'}" style="font-size:20px">${ac.ok?t.agePass:t.ageFail}</div>`:''}
    ${btn}</div>`;
}
function ageClick(e){
  const b=e.target.closest('[data-ov]'); if(!b||busy)return; const v=b.dataset.ov;
  if(v==='roll'){const x=d(20),el=ovEl.querySelector('[data-die="ad"]');
    rollDice(el?[el]:[],20,[x],y=>{const ok=y===20||(y!==1&&y+ageBonus()>=AGE_DC[S.age]);return y===20?'crit':y===1?'fumble':ok?'win':'lose'},()=>{ageCheck(x);const k=S.history[S.history.length-1].ageCheck;sfx(x===20?'nat20':x===1?'nat1':k.ok?'pass':'fail');save();ovUpdate(ageHTML())});return}
  if(v==='close'){closeOv();commit();return}
  if(v==='hang'){closeOv();retire();commit();window.scrollTo({top:0});return}

function featHTML(){

  return `<div class="ovcard move prepop"><span class="ov-kicker">${t.featKick}</span><h2 class="ov-title" style="font-size:24px">${t.featT}</h2><div class="ov-sub2">${t.featSub(S.age)}</div>
    <div class="prepg">${h.featOpts.map(k=>`<button class="prepb" data-ov="feat" data-k="${k}"><b>${t.feats[k][0]}</b><span>${t.feats[k][1]}</span></button>`).join('')}</div></div>`;
}
function campHTML(){
  return `<div class="ovcard move prepop"><span class="ov-kicker">${t.campT} · ${t.nextAge(S.age+1)}</span><h2 class="ov-title" style="font-size:24px">${t.campSub}</h2>
    <div class="prepg two">${(()=>{const h=S.history[S.history.length-1];return campOpts(h).map(a=>`<button class="prepb" data-ov="camp" data-k="tr:${a}"><b>${t.campTrain(t.attrs[a])}</b><span>${t.campTrainD(t.attrs[a],S.attrs[a],Math.min(20,S.attrs[a]+2))}</span></button>`).join('')+['rest','media'].map(k=>`<button class="prepb" data-ov="camp" data-k="${k}"><b>${t.camp[k][0]}</b><span>${t.camp[k][1]}</span></button>`).join('')})()}</div></div>`;

function prepClick(e){

function offersHTML(){
  const list=(S.startOffers||[]).map((o,i)=>{const r=clubRank(o.name,o.league);return `<div class="wcard">${crest(kitOf(o.name),26)}<b>${esc(o.name)}</b><span class="wl">${esc(LEAGUES[o.league].name)}</span><div class="wtags">${LEAGUES[o.league].c!==S.nat?`<span class="wtag">${t.euroOffer}</span>`:''}${LEAGUES[o.league].div===2?`<span class="wtag dim">${t.div2}</span>`:''}</div><button class="btn sm" data-ov="first" data-i="${i}">${t.sign}</button></div>`}).join('');

/* ---- the player's attributes as an octagon, like the old football games ---- */
function radar(){
  const a=S.attrs||{}, N=AK.length, cx=80, cy=78, R=56;
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return[(cx+Math.cos(ang)*R*v).toFixed(1),(cy+Math.sin(ang)*R*v).toFixed(1)]};
  const ring=v=>AK.map((_,i)=>pt(i,v).join(',')).join(' ');
  const poly=AK.map((k,i)=>pt(i,clamp((a[k]||0)/20,0,1)).join(',')).join(' ');
  const labels=AK.map((k,i)=>{const [x,y]=pt(i,1.24);return `<text x="${x}" y="${(+y+3).toFixed(1)}" text-anchor="middle">${t.attrs3[k]}</text><text x="${x}" y="${(+y+13).toFixed(1)}" text-anchor="middle" class="rv">${a[k]||0}</text>`}).join('');
  return `<svg class="radar" viewBox="0 0 160 166" aria-label="${t.attrsT}"><polygon points="${ring(1)}" class="rg"/><polygon points="${ring(.75)}" class="rg"/><polygon points="${ring(.5)}" class="rg"/><polygon points="${ring(.25)}" class="rg"/>${AK.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" class="rg"/>`).join('')}<polygon points="${poly}" class="rp"/>${labels}</svg>`;
}
