<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a clean match report. Single column, hairline rules, generous white space; the d20 is the one solid accent, everything else is ink on paper. */
:root{
  --bg:#f7f7f5; --card:#ffffff; --sunk:#f2f3f1; --ink:#15171c; --ink-2:#4a4f5c; --ink-3:#8a8f9b; --rule:#e2e3e0; --rule-2:#cfd1cc;
  --accent:#3346d3; --accent-soft:#eceefc; --on-accent:#ffffff;
  --good:#1f63d6; --good-soft:#e8f0fd; --bad:#c23a2e; --bad-soft:#fbeceb; --warn:#a86512; --warn-soft:#fbf1e3;
  --d20:#3346d3; --dnum:#ffffff; --d10:#ffffff; --d10num:#15171c; --dedge:rgba(21,23,28,.35);
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416;
  --d20:#6175ff; --dnum:#ffffff; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --card:#181a1f; --sunk:#1d1f25; --ink:#eceef2; --ink-2:#b0b4be; --ink-3:#7c818d; --rule:#2a2d34; --rule-2:#3a3e47;
  --accent:#8193ff; --accent-soft:#232842; --on-accent:#0e1018;
  --good:#6ea8ff; --good-soft:#17233a; --bad:#ff7a6e; --bad-soft:#331b1a; --warn:#e3a14d; --warn-soft:#2f2416;
  --d20:#6175ff; --dnum:#ffffff; --d10:#23262d; --d10num:#eceef2; --dedge:rgba(236,238,242,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-top:24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-ui);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600;line-height:1.15}
.lbl{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--ink-3);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.mark{font-weight:600;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark b{color:var(--accent);font-weight:600}
.mark svg{width:22px;height:22px;flex:none}
.mark svg{width:24px;height:24px}
.top .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.langs{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.langs button{background:transparent;border:0;color:var(--ink-3);font-size:12px;font-weight:600;padding:5px 9px;letter-spacing:.03em}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule-2);border-radius:7px;color:var(--ink-2);font-size:12px;font-weight:600;padding:5px 9px}
.theme-btn svg{width:14px;height:14px}
.theme-btn.icon{padding:5px 7px}
.theme-btn.icon svg path:first-child{fill:currentColor;fill-opacity:.15}
.theme-btn svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;border-bottom:1.5px solid transparent;color:var(--ink-3);font-weight:500;font-size:14.5px;padding:8px 12px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* panels */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}
.panel.hero{border-color:var(--rule-2)}
/* player sheet */
.who{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.who h2{font-size:26px}
.rating{text-align:right}
@media (max-width:520px){.rating{text-align:left}}
.rating .big{font-family:var(--f-num);font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em}
.pos{display:inline-flex;align-items:center;gap:8px}
.pos .ab{font-family:var(--f-num);font-weight:500;font-size:11px;border:1px solid var(--ink);padding:1px 6px;border-radius:4px;line-height:1.5}
.abil{display:grid;grid-template-columns:repeat(8,1fr);margin-top:18px;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
@media (max-width:620px){.abil{grid-template-columns:repeat(4,1fr)}}
.ab-cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.ab-cell .lbl{font-size:9.5px;letter-spacing:.01em;max-width:100%;line-height:1.25;white-space:nowrap}
@media (max-width:420px){.ab-cell .lbl,.pickbtn .lbl{font-size:8.5px;letter-spacing:0}}
.lshort{display:none} .l3{display:none}
@media (max-width:360px){.lfull{display:none}.lshort{display:inline}}
.ab-v{font-family:var(--f-num);font-weight:500;font-size:24px;line-height:1.1}
.ab-m{font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.gain,.loss{font-family:var(--f-num);font-size:11px;font-weight:600;vertical-align:super;margin-left:2px;line-height:0}
.gain{color:var(--good)} .loss{color:var(--bad)}
/* fan support */
.fanbar{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fb-state{font-size:13px;font-weight:600}
.fb-track{position:relative;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden}
.fb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .6s ease,background .3s}
.fb-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.9}
.fb-scale{position:relative;height:15px;font-size:10.5px;color:var(--ink-3)}.fb-scale span{position:absolute;top:0;white-space:nowrap}.fb-scale span:nth-child(2){transform:translateX(-50%)}.fb-scale span:last-child{right:0}
.teambar{margin-top:10px}
.bars .teambar{margin-top:10px}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv-card{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sv-big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sv-chips{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:12.5px;margin-top:6px}
.sv-list{display:flex;flex-direction:column}
.sv-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.sv-row:first-child{border-top:0}
.tabs{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.onepage{height:100vh;height:100dvh;overflow:hidden}
.onepage .wrap{height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
.onepage .wrap>*{flex:none}
.onepage .wrap>.panel.hero{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.onepage .wrap>.panel.hero>.stage{margin:auto 0}
.onepage .panel{padding:14px 16px}
.onepage .who h2{font-size:22px}
.onepage .rating .big{font-size:30px}
.onepage .fanbar{margin-top:10px;gap:4px}
.onepage .fb-scale{display:none}
.onepage .bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.onepage .bars .fanbar{margin-top:10px}
.onepage .abil{margin-top:12px}
.onepage .ab-cell{padding:6px 2px}
.onepage .ab-v{font-size:20px}
.onepage .dicecol .d20{max-width:104px}
.onepage .dicecol .die{max-width:96px}
.onepage .verdict{font-size:20px}
.onepage .install{display:none}
html.onepage,body.onepage{margin:0;height:100%;overflow:hidden;box-sizing:border-box}
.onepage .rating>.lbl:last-child{display:none}
.onepage .who .pos .lbl{font-size:10.5px}
.onepage .stage .lbl{font-size:10px}
.onepage .stage .evbox{padding:7px 10px;gap:3px}
.onepage .stage .evbox,.onepage .stage .evdesc{font-size:12.5px;line-height:1.4}
.onepage .stage .sum{font-size:13px}
.onepage .stage .verdict{font-size:18px}
.onepage .stage .muted.small,.onepage .stage .small{font-size:12px}
.onepage .stage .banner{font-size:13px;padding:6px 10px}
.onepage .top{flex-wrap:nowrap;padding-bottom:0}
.onepage .top .meta{flex-wrap:nowrap;gap:6px}
.onepage .top .meta>.lbl,.onepage .top [data-act="reset"],.onepage .theme-btn .tl{display:none}
.onepage .mark{font-size:20px}
.onepage .tabs button{padding-block:6px}
@media (max-width:440px){.tabs{gap:0}.tabs button{padding-inline:6px;font-size:13px}.tabs .tab-home{padding-inline:4px 8px}.tablogo{width:24px;height:24px}}
.onepage .who{flex-wrap:nowrap;gap:10px}
.onepage .who>.stack{gap:3px!important;min-width:0}
.onepage .who .muted{font-size:14px}
.onepage .rating .big{font-size:26px}
.onepage .bars .fanbar{margin-top:8px}
.onepage .abil{grid-template-columns:repeat(8,1fr)!important;margin-top:10px}
.onepage .lfull,.onepage .lshort{display:none!important} .onepage .l3{display:inline}
.onepage .ab-cell{padding:5px 1px}
.onepage .ab-v{font-size:18px}
.onepage .ab-m{font-size:10px}
.onepage .wrap>.panel.hero{padding:12px 14px}
.onepage .stage{grid-template-columns:96px minmax(0,1fr)!important;gap:14px;justify-items:stretch!important;text-align:left!important;align-items:center}
.onepage .stage .mods,.onepage .stage .row{justify-content:flex-start!important}
.onepage .stage h3{font-size:19px}
.onepage .stage .dicecol{gap:6px}
.onepage .stage .dicecol .d20{max-width:84px}
.onepage .stage .dicecol .die{max-width:72px}
.onepage .stage .pair{gap:4px;flex-wrap:wrap;justify-content:center}
.onepage .stage .pair .die{max-width:46px}
.onepage .stage .dicecol .small{max-width:34px}
.onepage .stage .dcell .lbl{font-size:9px}
.onepage .stage .stack{gap:7px!important}
.onepage .stage .evdesc,.onepage .stage .evbox{font-size:13.5px}
.onepage .stage .chip{font-size:11.5px;padding:2px 7px}
.onepage .stage .btn{padding:9px 14px;font-size:14px}
.onepage .stage .row{flex-wrap:nowrap;align-items:center}
.tl-s{display:none} .onepage .tl-l{display:none} .onepage .tl-s{display:inline}
.onepage .stage [data-act="simrest"]{display:none}
.onepage .stage .row .btn:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onepage .stage .btn.ghost.sm{flex:none;padding:8px 10px;font-size:12.5px}
.tabs .tab-home{display:inline-flex;align-items:center;justify-content:center;padding-inline:10px}
.tablogo{width:26px;height:26px;display:block}
.tab-home[aria-selected="true"] .tablogo{color:var(--accent)}
.teambar .fb-fill{background:var(--ink-3)} .teambar .fb-state{color:var(--ink-2)}
.teambar.tl0 .fb-fill,.teambar.tl1 .fb-fill{background:var(--accent)} .teambar.tl0 .fb-state,.teambar.tl1 .fb-state{color:var(--accent)}
.fl0 .fb-fill{background:var(--bad)} .fl0 .fb-state{color:var(--bad)}
.fl1 .fb-fill{background:var(--warn)} .fl1 .fb-state{color:var(--warn)}
.fl2 .fb-fill{background:var(--ink-3)} .fl2 .fb-state{color:var(--ink-2)}
.fl3 .fb-fill,.fl4 .fb-fill{background:var(--good)} .fl3 .fb-state,.fl4 .fb-state{color:var(--good)}
.fl5 .fb-fill{background:var(--accent)} .fl5 .fb-state{color:var(--accent)}
.fl6 .fb-fill{background:linear-gradient(90deg,var(--good),var(--accent))} .fl6 .fb-state{color:var(--accent)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.chip.fit{color:var(--good);border-color:transparent;background:var(--good-soft)}
.chip.inj{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.chip.yel{color:var(--accent);border-color:transparent;background:var(--accent-soft);font-weight:600}
.chip.gold{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.chip.hot{color:var(--bad);border-color:var(--bad);font-weight:600}
/* dice */
.dice{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:620px){.dice{grid-template-columns:repeat(4,1fr)}}
.dcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.die{width:100%;max-width:72px;height:auto;display:block;overflow:visible;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
.die .face{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;transition:fill .3s,stroke .3s}
.die .edge{stroke:var(--dedge);stroke-width:1;fill:none}
.d20 .face{fill:var(--d20);stroke:var(--d20)} .d20 .edge{stroke:rgba(255,255,255,.35)} .d20 text{fill:var(--dnum)}
.d10 .face,.dN .face{fill:var(--d10)} .d10 text,.dN text{fill:var(--d10num)}
.die.evd .face{fill:var(--warn-soft);stroke:var(--warn)} .die.evd text{fill:var(--warn)}
.die text{font-family:var(--f-num);font-weight:500;text-anchor:middle;dominant-baseline:central}
.die.crit .face{fill:#e2a93b;stroke:#c98f22} .die.crit text{fill:#1a1405} .die.crit .edge{stroke:rgba(255,255,255,.35)}
.die.fumble .face{fill:var(--bad);stroke:var(--bad)} .die.fumble text{fill:#fff} .die.fumble .edge{stroke:rgba(255,255,255,.35)}
.die.dropped{opacity:.25}
.dbtn{background:none;border:1px solid transparent;padding:8px 2px;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px;width:100%}
.dbtn:not(:disabled):hover{border-color:var(--rule)}
.dbtn:disabled{cursor:default}
.dbtn .lbl{font-size:10px;letter-spacing:.04em}
.hint{font-size:11px;color:var(--ink-3);min-height:1.2em}
.dicecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.dicecol .die{max-width:110px}
.dicecol .d20{max-width:130px}
.dicecol .small{max-width:52px}
.pair{display:flex;gap:8px;justify-content:center}
.pair .die{max-width:80px}
/* buttons */
button{font:inherit;cursor:pointer}
.btn{font-weight:600;font-size:15px;padding:10px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{font-size:13px;padding:6px 11px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--rule-2);border-radius:8px;padding:8px 11px}
input[type=text]{flex:1 1 200px;min-width:0;max-width:340px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:end}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .btn{white-space:nowrap}
/* match card */
.stage{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:520px){.stage{grid-template-columns:1fr;justify-items:center;text-align:center}.stage .mods,.stage .row{justify-content:center}.evbox{text-align:left}}
.stage h3{font-size:22px}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.sum{font-family:var(--f-num);font-size:14px}
.sum b{color:var(--accent);font-weight:600}
.verdict{font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.v-good{color:var(--good)} .v-bad{color:var(--bad)} .v-mid{color:var(--warn)}
.banner{border:1px solid var(--rule-2);border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:500;padding:8px 12px;border-radius:6px;font-size:14.5px}
.banner.bad{border-left-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.evdesc{color:var(--ink-2);max-width:48ch}
.evbox{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--sunk)}
.evbox.ok{border-color:var(--good)} .evbox.bad{border-color:var(--bad)}
.fx{font-size:13px;font-weight:600}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.styles{grid-template-columns:1fr}}
.stylebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.stylebtn:hover{border-color:var(--ink)}
.stylebtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.stylebtn b{font-weight:600}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.pickbtn{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:1px solid var(--rule-2);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.pickbtn:hover:not(:disabled){border-color:var(--good)}
.pickbtn:disabled{opacity:.4;cursor:default}
.pickbtn .lbl{font-size:9.5px;letter-spacing:.01em;white-space:nowrap;text-align:center}
.pickbtn b{font-family:var(--f-num);font-weight:500;font-size:12.5px;white-space:nowrap}
.offer select{width:100%;font-size:15px}
.fx.up{color:var(--good)} .fx.down{color:var(--bad)} .fx.flat{color:var(--ink-3)}
.result{animation:reveal .45s ease-out both}
#app[data-still] .result{animation:none}
@keyframes reveal{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* season log */

const THEMEKEY='rpgoal-theme';
function effTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
try{const th=localStorage.getItem(THEMEKEY);if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}
const LANGKEY='rpgoal-lang', HOFKEY='rpgoal-hof', VIEWKEY='rpgoal-view';
let lang=(()=>{try{const v=localStorage.getItem(LANGKEY);if(v)return v}catch(e){}return (navigator.language||'').toLowerCase().startsWith('pt')?'pt':'en'})();
let t=T[lang];
let view=(()=>{try{const v=localStorage.getItem(VIEWKEY);return ['hof','season','stats','ach'].includes(v)?v:'game'}catch(e){return'game'}})();
const ord=n=>{if(lang==='pt')return n+'º';const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

const KEY='rpgoal-save-v2';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const d=n=>1+Math.floor(Math.random()*n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rating=a=>AK.reduce((s,k)=>s+a[k],0)/AK.length;
const pmod=r=>Math.max(-2,Math.round((r-5)*0.4));
const keyBonus=v=>Math.floor(v/5);
function sg(n){return (n>=0?'+':'−')+Math.abs(n)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>lang==='pt'?n.toFixed(1).replace('.',','):n.toFixed(1);
const tierOf=(Li,ti)=>LEAGUES[Li].tiers[Math.min(ti,LEAGUES[Li].tiers.length-1)];
const lgCountry=Li=>COUNTRY[lang][LEAGUES[Li].c];
const wcNeed=nat=>12+NATIONS[nat].mod;
function randomName(nat){const N=NATIONS[nat];if(N.nick&&Math.random()<.18)return pick(N.nick);return pick(N.first)+' '+pick(N.last)}

let S=fresh();
function fresh(){return{phase:'create',nat:'BRA',name:randomName('BRA'),roll:{},rerolls:1,history:[],trophies:[]}}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSync)cloudSync()}
function fixSave(x){
  if(!x)return x;
  const f=o=>{if(!o)return;if(!LEAGUES[o.league])o.league=0;const n=LEAGUES[o.league].tiers.length;if(!(o.tier>=0))o.tier=0;if(o.tier>=n)o.tier=n-1};
  if(!NATIONS[x.nat])x.nat='BRA';
  if(!x.roll)x.roll={};
  f(x.club);(x.history||[]).forEach(f);(x.offers||[]).forEach(f);
  if((x.startOffers||[]).some(o=>!LEAGUES[o.league]||o.tier>=LEAGUES[o.league].tiers.length))x.startOffers=null;
  if(x.phase==='create')x.startOffers=null;

function fxLine(fx){
  if(fx.mode==='adv')return `<span class="fx up">${t.fx.adv}</span>`+(fx.buff?` <span class="fx up">· ${t.fx.buff(fx.buff)}</span>`:'');
  if(fx.mode==='dis')return `<span class="fx down">${t.fx.dis}</span>`;
  if(fx.buff)return `<span class="fx ${fx.buff>0?'up':'down'}">${t.fx.buff(fx.buff)}</span>`;
  return `<span class="fx flat">${t.fx.none}</span>`;
}

function loadAch(){if(achMem)return{...achMem};try{achMem=JSON.parse(localStorage.getItem(ACHKEY)||'{}')||{}}catch(e){achMem={}}return{...achMem}}
function saveAch(a){achMem={...a};try{localStorage.setItem(ACHKEY,JSON.stringify(a))}catch(e){}if(window.cloudSync)cloudSync()}
function checkAch(silent){
  if(!S||S.phase==='create')return;
  if(S.club&&fanTier()===0)S.hatedAt=S.club.name;
  const got=loadAch(), newly=[];
  ACH.forEach(a=>{if(got[a.id])return;let ok=false;try{ok=a.test()}catch(e){}if(ok){got[a.id]=Date.now();newly.push(a)}});
  if(!newly.length)return;
  saveAch(got); if(view==='ach')render();
  if(!silent)newly.forEach(a=>toastQ.push(a));
  showToast();
}
/* a small banner at the top: not blocking, gone after a few seconds */
let toastQ=[], toastEl=null;
function showToast(){
  if(toastEl||!toastQ.length||typeof document==='undefined'||!document.body)return;
  const a=toastQ.shift(), L=lang==='pt'?1:0, more=toastQ.length;
  toastEl=document.createElement('div'); toastEl.className='toast'+(a.bad?' bad':''); toastEl.setAttribute('role','status');
  toastEl.innerHTML=`${achIcon(a,true)}<div class="toast-t"><span class="lbl">${a.bad?t.achBadT:t.achT}${more?` · +${more}`:''}</span><b>${a.n[L]}</b><span>${a.d[L]}</span></div>`;
  document.body.appendChild(toastEl); sfx(a.bad?'achBad':'ach');
  const el=toastEl, hide=()=>{if(toastEl!==el)return;el.classList.add('out');setTimeout(()=>{el.remove();toastEl=null;showToast()},reduce?0:260)};
  el.addEventListener('click',hide); setTimeout(hide,3800);
}

function compStatus(comp){
  const s=S.season, st=s.stages.filter(x=>x.comp===comp); if(!st.length)return null;
  const done=st.filter(x=>x.res&&!x.res.skipped), out=st.some(x=>x.res&&x.res.skipped)||done.some(x=>x.res.win===false&&!x.res.wdl);
  const champ=done.some(x=>x.res.champ), next=st.find(x=>!x.res);
  let txt,tone='m';
  if(champ){txt=t.won;tone='w'}
  else if(out){const lost=done.filter(x=>x.res.win===false||x.res.wdl==='L').pop()||done[done.length-1];txt=t.outIn(lost?roundName(lost):roundName(st[0]));tone='l'}
  else if(next){txt=done.length?t.stillIn(roundName(next)):t.startsIn(roundName(next));tone=done.length?'w':'m'}
  else txt='—';
  return{name:compName(comp,S.club.league),txt,tone};
}

let pendingMove=null;
function moveTarget(m){
  if(m.kind==='sign')return S.offers[m.i];

  if(m.kind==='any')return m.club;
  return null;
}
function moveReasons(to){
  const h=S.history[S.history.length-1], from=S.club.name, ten=S.tenure||0, ft=fanTier(), out=[];
  if(h&&h.fired)return[t.mvFired(esc(from))];
  const titles=S.history.filter(x=>x.club===from).reduce((a,x)=>a+x.trophies.filter(y=>y.kind!=='bdo'&&y.kind!=='wc').length,0);
  if(S.legend===from)out.push(t.mvLegend(esc(from)));
  else if(ft>=5)out.push(t.mvGreats(esc(from)));
  else if(ft>=4)out.push(t.mvLoved(esc(S.name||t.unnamed)));
  if(ten>=2)out.push(t.mvTenure(ten,esc(from)));
  if(titles>=2)out.push(t.mvTitles(titles));
  if(ten>=3&&ft>=3)out.push(t.mvPresident);
  const next=Math.ceil((ten+1)/5)*5;
  if(ten>=3&&next-ten===1)out.push(t.mvMilestone(next));
  if(isRival(from,to.name))out.push(t.mvRival(esc(to.name)));
  const bk=returnInfo(to.name); if(bk)out.push(bk.rival?t.mvBackRival(esc(to.name),esc(bk.rival)):t.mvBack(esc(to.name)));
  if(to.mode==='any')out.push(t.mvLast);
  if(ten>=3||ft>=3)out.push(t.mvReset);
  if(!out.length)out.push(t.mvFree(esc(from)));
  return out;
}
function confirmMove(m){

function doMove(m){

}

      if(e.target===ovEl||e.target.closest('[data-ov="close"]'))closeOv();return}
    if(o.k==='move'){const go=e.target.closest('[data-ov="go"]');if(go){const m=pendingMove;closeOv();doMove(m);return}
      if(e.target===ovEl||e.target.closest('[data-ov="close"]')){pendingMove=null;closeOv();if(S.phase==='offseason')openWindow()}return}
    if(o.k==='window'){
      const b=e.target.closest('[data-ov]');
      if(!b){if(e.target===ovEl)closeOv();return}
      const v=b.dataset.ov;
      if(v==='close'){closeOv();return}
      if(v==='stay'){closeOv();newSeason(null);commit();window.scrollTo({top:0});return}
      if(v==='sign'){closeOv();confirmMove({kind:'sign',i:+b.dataset.i});return}
      if(v==='home'){closeOv();confirmMove({kind:'home'});return}
      if(v==='anyclub'){const val=(ovEl.querySelector('#anyclubOv')||{}).value;if(!val)return;const [Li,ti,...n]=val.split('|');closeOv();confirmMove({kind:'any',club:{name:n.join('|'),league:+Li,tier:+ti,mode:'any'}});return}
      return}
    if(o.k!=='career'||e.target.closest('[data-ov="close"]'))closeOv()});
}
document.addEventListener('keydown',e=>{if(ovEl&&(e.key==='Escape'||((e.key==='Enter'||e.key===' ')&&!ovEl.classList.contains('ovl-move')))){e.preventDefault();if(ovEl.classList.contains('ovl-move'))pendingMove=null;closeOv()}});
function checkIntro(){
  if(S.phase!=='season'||view!=='game'||!S.season)return;
  const s=S.season, st=s.stages[s.idx];
  if(!st||s.last||st.res||st.intro||st.comp==='league'||st.round!==lastRound(st.comp))return;
  st.intro=1; save(); ovQ.unshift({k:'final',comp:st.comp,lg:S.club.league,opp:st.opp||null});
}


/* ---------- sound: everything is synthesised here, soft by design ---------- */
const SNDKEY='rpgoal-sound';
let soundOn=(()=>{try{return localStorage.getItem(SNDKEY)!=='off'}catch(e){return true}})();
let actx=null, master=null;
function ac(){
  if(!soundOn)return null;
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();
      const comp=actx.createDynamicsCompressor();comp.threshold.value=-30;comp.knee.value=20;comp.ratio.value=6;
      const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;lp.Q.value=.4;
      master=actx.createGain();master.gain.value=.16;master.connect(lp);lp.connect(comp);comp.connect(actx.destination)}
    if(actx.state==='suspended')actx.resume();
    return actx;
  }catch(e){return null}
}
function tone(f,t0,dur,o={}){
  const c=actx, os=c.createOscillator(), g=c.createGain(), vol=o.vol??.15;
  os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0); if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+(o.a||.006)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  os.connect(g); g.connect(master); os.start(t0); os.stop(t0+dur+.03);
}
let noiseBuf=null;
function tick(t0,vol){
  const c=actx;
  if(!noiseBuf){noiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*.04),c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
  const src=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
  src.buffer=noiseBuf; bp.type='bandpass'; bp.frequency.value=900+Math.random()*700; bp.Q.value=1.6; g.gain.value=vol;
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t0);
  tone(220+Math.random()*120,t0,.06,{vol:vol*.4,a:.003});   // a little body under the click, like a die on wood
}
const SFX={
  // a few muffled taps, like a die settling on felt
  roll(ms){let t=actx.currentTime;const n=Math.max(5,Math.round(ms/140));for(let k=0;k<n;k++){const p=k/n;tick(t,.17*(1-p*.55));t+=.05+.17*p*p}},
  // a soft marimba-like note
  pass(){const t=actx.currentTime;tone(659.25,t,.6,{vol:.23,a:.012});tone(1318.5,t,.25,{vol:.025,a:.012})},
  nat20(){const t=actx.currentTime;[523.25,659.25,784,1046.5].forEach((f,k)=>tone(f,t+k*.085,.9,{vol:.075,a:.015}));tone(2093,t+.36,.7,{vol:.012,a:.03})},
  fail(){const t=actx.currentTime;tone(196,t,.32,{vol:.25,f2:174.6,a:.015})},
  nat1(){const t=actx.currentTime;tone(220,t,.32,{vol:.13,a:.015});tone(164.8,t+.2,.6,{vol:.13,f2:155.6,a:.02})},
  title(){const t=actx.currentTime;[392,523.25,659.25,784].forEach((f,k)=>tone(f,t+k*.11,1.6,{vol:.055,a:.02}));
    [523.25,659.25,784].forEach(f=>tone(f,t+.5,1.8,{vol:.03,a:.25}));tone(1568,t+.62,.9,{vol:.01,a:.05})},
  qual(){const t=actx.currentTime;tone(587.3,t,.5,{vol:.09,a:.015});tone(784,t+.12,.7,{vol:.09,a:.015})},
  ach(){const t=actx.currentTime;tone(880,t,.45,{vol:.09,a:.012});tone(1318.5,t+.1,.6,{vol:.08,a:.012})},
  achBad(){const t=actx.currentTime;tone(293.7,t,.35,{vol:.09,a:.015});tone(246.9,t+.12,.5,{vol:.09,a:.015})}
};
const sfx=(k,...a)=>{try{if(soundOn&&ac())SFX[k](...a)}catch(e){}};
/* what a resolved roll sounds like */
function sfxStage(){
  const s=S.season, r=s&&s.last; if(!r||r.missed)return;
  if(r.champ)return;                                     // the title fanfare follows
  if(r.nat===20)return sfx('nat20'); if(r.nat===1)return sfx('nat1');
  if(r.wdl)return r.wdl==='W'?sfx('pass'):r.wdl==='L'?sfx('fail'):null;
  if(r.kind!=null)return r.kind<=1?sfx('pass'):r.kind>=3?sfx('fail'):null;
  sfx(r.win?'pass':'fail');
}

/* ---------- dice animation ---------- */
const app=document.getElementById('app');
let busy=false, resetArm=false, hofArm=false, retireArm=false, anims=0;
function setFace(el,v){const tx=el.querySelector('text');if(tx)tx.textContent=v}
function rollDice(els,sides,finals,clsFn,done){
  if(!els.length){done();return}
  if(reduce){els.forEach((el,i)=>{setFace(el,finals[i]);const c=clsFn(finals[i]);if(c)el.classList.add(c)});setTimeout(done,150);return}
  busy=true; anims++;
  const D=fastRoll?700:sides===20?1250:1050; fastRoll=false; let left=els.length;
  sfx('roll',D);
  els.forEach((el,i)=>{
    const delay=i*70, dir=i%2?1:-1;
    el.classList.remove('crit','fumble','dropped');
    let cur=d(sides); setFace(el,cur);                       // numbers from the very first frame
    el.animate([
      {transform:'translateY(0) rotate(0deg) scale(1)'},
      {transform:`translateY(-9%) rotate(${dir*420}deg) scale(.92)`,offset:.45},
      {transform:`translateY(0) rotate(${dir*700}deg) scale(1.03)`,offset:.85},
      {transform:`translateY(0) rotate(${dir*720}deg) scale(1)`}
    ],{duration:D,delay,easing:'cubic-bezier(.2,.7,.25,1)'});
    const t0=performance.now()+delay; let next=0;
    const tick=ts=>{
      const e=ts-t0;
      if(e>=D){
        setFace(el,finals[i]);
        const c=clsFn(finals[i]); if(c)el.classList.add(c);
        el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:240,easing:'ease-out'});
        if(--left===0)setTimeout(()=>{anims--;done();setTimeout(()=>{if(anims<=0){anims=0;busy=false}},400)},380);
        return;
      }
      if(e>=next){let v;do{v=d(sides)}while(v===cur&&sides>1);cur=v;setFace(el,v);const p=Math.max(0,e)/D;next=Math.max(0,e)+45+120*p*p}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- interaction ---------- */
function commit(){save();render();checkIntro();maybeWindow();flushOv();checkAch();scheduleAuto()}
let autoT=null, fastRoll=false;
function scheduleAuto(){
  clearTimeout(autoT); autoT=null;
  if(view!=='game'||S.phase!=='season'||!S.season)return;
  const s=S.season; if(s.pendingHeal||s.careerOver||s.pickAttr||s.out<=0)return;
  const fire=fn=>()=>{if(busy||ovEl){autoT=setTimeout(fire(fn),200);return}fn()};
  if(!s.last){autoT=setTimeout(fire(()=>{fastRoll=true;doRoll()}),1100);return}
  autoT=setTimeout(fire(()=>{nextStage();commit()}),s.last.injury?3200:1900);
}
let shuffleTimer=null;
function shuffleName(){
  clearInterval(shuffleTimer);
  let final;do{final=randomName(S.nat)}while(final===S.name);
  S.name=final;save();
  const inp=document.getElementById('pname'); if(!inp)return;
  if(reduce){inp.value=final;return}
  let n=0;
  shuffleTimer=setInterval(()=>{const el=document.getElementById('pname');if(!el){clearInterval(shuffleTimer);return}
    if(++n>=7){el.value=final;clearInterval(shuffleTimer);return}
    el.value=randomName(S.nat)},45);
}
function doRoll(){
  const s=S.season; if(!s||s.last||s.pendingHeal||s.pickAttr)return;
  centerOn(app.querySelector('.stage'));
  const st=s.stages[s.idx];
  if(st.ev&&!st.evr){
    const e=EVMAP[st.ev], v=d(e.die), el=app.querySelector('[data-die="ev"]');
    rollDice(el?[el]:[],e.die,[v],x=>x===e.die||(x!==1&&x+evBonus(e)>=evTarget(e))?'crit':'fumble',()=>{resolveEvent(v);const r=st.evr;sfx(r.perfect?'nat20':r.nat===1?'nat1':r.ok?'pass':'fail');commit()});
    return;
  }
  const v1=d(20), v2=d(20);
  const els=[app.querySelector('[data-die="stage"]'),app.querySelector('[data-die="stage2"]')].filter(Boolean);
  rollDice(els,20,[v1,v2].slice(0,els.length||1),dieCls(20),()=>{resolveStage(v1,v2);sfxStage();commit()});
}
app.addEventListener('input',e=>{if(e.target.id==='pname'){S.name=e.target.value;save()}});
app.addEventListener('change',e=>{if(e.target.id==='pnat'){S.nat=e.target.value;S.name=randomName(S.nat);S.startOffers=null;commit()}});
app.addEventListener('click',e=>{try{onClick(e)}catch(err){console.error(err);busy=false;try{S=fixSave(S);if(S.phase==='season'&&!S.season)buildSeason();render()}catch(e2){}}});
function onClick(e){
  const b=e.target.closest('[data-act]'); if(!b||busy||b.disabled)return;
  const act=b.dataset.act;
  if(act!=='theme'&&act!=='lang'&&act!=='sound'){clearTimeout(autoT);autoT=null}
  if(act!=='reset'&&resetArm){resetArm=false}
  if(act!=='retire'&&retireArm){retireArm=false}
  if(act!=='hofclear'&&hofArm){hofArm=false}
  if(act==='sound'){soundOn=!soundOn;try{localStorage.setItem(SNDKEY,soundOn?'on':'off')}catch(e){};render();if(soundOn)sfx('pass');return}
  if(act==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}return}
  if(act==='theme'){const nt=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=nt;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',nt==='dark'?'#121317':'#f7f7f5'));try{localStorage.setItem(THEMEKEY,nt)}catch(e){};render();return}
  if(act==='lang'){lang=b.dataset.l;t=T[lang];try{localStorage.setItem(LANGKEY,lang)}catch(e){};document.documentElement.lang=lang==='pt'?'pt-BR':'en';render();return}
  if(act==='tab'){view=b.dataset.v;try{localStorage.setItem(VIEWKEY,view)}catch(e){};render();scheduleAuto();window.scrollTo({top:0});return}
  if(act==='hofsub'){hofSub=b.dataset.v;render();return}
  if(act==='hofclear'){if(hofArm){saveHof([]);hofArm=false}else hofArm=true;render();return}
  if(act==='randname'){shuffleName();return}
  if(act==='recap'){ovQ.push({k:'career'});flushOv();return}
  if(act==='window'){openWindow();return}
  if(act==='roll6'||act==='roll1'){
    const a=S.roll||{}, all=AK.every(k=>a[k]);
    let keys;
    if(act==='roll1'){const k=b.dataset.k;if(a[k]){if(!all||S.rerolls<1)return;S.rerolls--}keys=[k]}
    else if(all){if(S.rerolls<1)return;S.rerolls--;keys=AK}
    else keys=AK.filter(k=>!a[k]);
    const vals=keys.map(()=>d(10));
    rollDice(keys.map(k=>app.querySelector(`[data-die="a-${k}"]`)).filter(Boolean),10,vals,d10cls,()=>{const r={...a};keys.forEach((k,i)=>r[k]=vals[i]);S.roll=r;S.startOffers=null;commit()});
  }
  else if(act==='style'){S.style=b.dataset.s;commit()}
  else if(act==='first'){if(!styleOf(bestPos(S.roll),S.style))return;startCareer(S.startOffers[+b.dataset.i]);commit();window.scrollTo({top:0})}
  else if(act==='roll'){doRoll()}
  else if(act==='inj4'){centerOn(app.querySelector('.stage'));const v=d(4);const el=app.querySelector('.inj4');rollDice(el?[el]:[],4,[v],x=>x>=3?'crit':'fumble',()=>{injD4(v);sfx(v>=3?'pass':'fail');commit()})}
  else if(act==='inj10'){centerOn(app.querySelector('.stage'));const a=d(10),c=d(10);const e1=app.querySelector('[data-die="inj100"]'),e2=app.querySelector('[data-die="inj101"]');rollDice(e1?[e1]:[],10,[a],()=>'',()=>{rollDice(e2?[e2]:[],10,[c],()=>'',()=>{injD10(a,c);const I=S.season.inj;sfx(I.career?'nat1':I.lucky?'nat20':I.season?'fail':I.out===0?'pass':null);commit()})})}
  else if(act==='endcareer'){endCareer();commit();window.scrollTo({top:0})}
  else if(act==='go'){nextStage();commit();if(S.phase!=='season')window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
  else if(act==='simrest'){view='game';simRest();commit();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
  else if(act==='sign'){confirmMove({kind:'sign',i:+b.dataset.i})}
  else if(act==='stay'){newSeason(null);commit();window.scrollTo({top:0})}
  else if(act==='pick'){pickAttr(b.dataset.k);commit()}
  else if(act==='retire'){ovQ.unshift({k:'retire'});flushOv()}
  else if(act==='hangup'){retire();commit();window.scrollTo({top:0})}
  else if(act==='agechk'){centerOn(app.querySelector('.agechk'));const v=d(20),el=app.querySelector('[data-die="agechk"]');rollDice(el?[el]:[],20,[v],x=>{const ok=x===20||(x!==1&&x+ageBonus()>=AGE_DC[S.age]);return x===20?'crit':ok?'':'fumble'},()=>{ageCheck(v);const k=S.history[S.history.length-1].ageCheck;sfx(v===20?'nat20':v===1?'nat1':k.ok?'pass':'fail');commit()})}
  else if(act==='home'){confirmMove({kind:'home'})}
  else if(act==='anyclub'){const v=(document.getElementById('anyclub')||{}).value;if(!v)return;const [Li,ti,...n]=v.split('|');confirmMove({kind:'any',club:{name:n.join('|'),league:+Li,tier:+ti,mode:'any'}})}
  else if(act==='reset'){
    if(S.phase==='create'||S.phase==='retired'||resetArm){resetArm=false;const n=S.nat;S=fresh();S.nat=n;S.name=randomName(n);view='game';commit()}
    else{resetArm=true;render()}
  }
}
/* ---------- installable app ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let installEvt=null;
function installRow(){
  if(standalone)return'';
  if(iOS)return `<footer class="install">${t.installIOS}</footer>`;
  if(installEvt)return `<footer class="install"><button data-act="install">${t.installBtn}</button></footer>`;
  return'';
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
addEventListener('appinstalled',()=>{installEvt=null;render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function start(data){
  S=(data&&data.phase)?fixSave(data):(load()||fresh());
  if(S.phase==='season'&&!S.season)buildSeason();
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
  render(); checkIntro(); maybeWindow(); flushOv(); checkAch(true); scheduleAuto();
}
start({});
